    <script>
        $(document).ready(function () {
            fnSetPageName("Sale Invoice");

            $("#lstSaleInvoice").kendoListView({
                dataSource: {
                    transport: {
                        read: {
                            url: '/api/SaleInvoice?TranDate=' + kendo.toString(new Date(), "yyyy-MM-dd") + '&DepotID=' + localStorage.getItem("DepotID"),
                            dataType: "json"
                        }
                    }, sort: [{ field: "IsPrinted", dir: "asc" },{ field: "SoldToParty", dir: "asc" }]
                },
                template: kendo.template($("#tmpSaleInvoice").html()),
                selectable: "single",
                change: function (e) {
                    e.preventDefault();
                    var selectedItems = e.sender.select();
                    let dataItem = $("#lstSaleInvoice").data("kendoListView").dataItem(selectedItems);
                    //window.location.href = "../MV/SaleInvoicePrint.html?LSID=" + dataItem.LSID;
                    window.location.assign("SaleInvoicePrint.html?LSID=" + dataItem.LSID);
                }
            });
        });

    </script>
