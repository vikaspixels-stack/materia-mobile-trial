        /* Compact anchored dropdowns (replaces the old full-screen Kendo windows) */
        .ms-dropdown {
            position: fixed;
            z-index: 11000;
            background: #fff;
            border: 1px solid #b0b0b0;
            border-radius: 6px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.20);
            padding: 0;
            box-sizing: border-box;
            overflow: hidden; /* the inner list scrolls, not the shell */
        }
        /* Scrollable list area; vertical scrollbar only, never horizontal */
        .ms-dd-list {
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
        }

        .ms-dd-product {
            max-height: 150px;
        }
        /* ~2-3 products, then scroll */
        .ms-dd-dealer {
            max-height: 300px;
        }
        /* room for ~8-10 dealers, then scroll */
        /* Full-width dropdown: keep items on one line where possible; the list never
           scrolls horizontally, so anything too long still wraps rather than overflow */
        .ms-dropdown .k-listview-item,
        .ms-dropdown .k-listview-item * {
            white-space: nowrap;
            word-break: normal;
        }

        .ms-dd-search {
            padding: 6px;
            border-bottom: 1px solid #eee;
        }

            .ms-dd-search input {
                width: 100%;
                box-sizing: border-box;
                padding: 5px 8px;
            }
    </style>

    <script>var Product1, Product2, Product3 = undefined;
        //const BASE_LAT = 9.9252;
        //const BASE_LON = 78.1198;
        //Madurai

        var BASE_LAT = parseFloat(localStorage.getItem("DepotLatitude"));
        var BASE_LON = parseFloat(localStorage.getItem("DepotLongitude"));

        // ── Dealer / product scoping state ──────────────────────────────────────
        var g_productUrl = null;               // dealer-scoped products endpoint (set when a dealer is chosen)
        var g_maxBags = { 1: 0, 2: 0, 3: 0 };  // max allowed bags per product slot (from the dealer's order)

        function getSelectedSoldToCode() {
            var h = $('#dvDealer').html() || '';
            return (h.indexOf(' | ') === -1) ? '' : h.split(' | ')[0].trim();
        }

        function isDealerSelected() {
            return getSelectedSoldToCode() !== '';
        }

        // (Re)bind a product listview to the dealer-scoped endpoint, or to empty if no dealer yet.
        function reloadProductList(sel) {
            var lv = $(sel).data("kendoListView");
            if (!lv) return;
            if (!g_productUrl) {
                lv.setDataSource(new kendo.data.DataSource({ data: [] }));
                return;
            }
            lv.setDataSource(new kendo.data.DataSource({
                transport: { read: { url: g_productUrl, dataType: "json" } },
                sort: { field: "RowNum", dir: "asc" }
            }));
        }

        // Apply the per-slot bag cap to a quantity box (called when a product is chosen).
        function applyQtyMax(n) {
            var w = $("#txtQuantity" + n).data("kendoNumericTextBox");
            if (!w) return;
            var maxB = g_maxBags[n] || 0;
            w.max(maxB > 0 ? maxB : 100000);
            var v = w.value();
            if (maxB > 0 && v != null && v > maxB) {
                alert("Quantity for this product cannot exceed the available order quantity of " + maxB + " bag(s).");
                w.value(maxB);
            }
        }

        // Validate a quantity box against its slot cap (called on change).
        function _validateQty(n, widget) {
            var w = widget || $("#txtQuantity" + n).data("kendoNumericTextBox");
            if (!w) return;
            var maxB = g_maxBags[n] || 0;
            var v = w.value();
            if (maxB > 0 && v != null && v > maxB) {
                alert("Quantity for this product cannot exceed the available order quantity of " + maxB + " bag(s).");
                w.value(maxB);
            }
        }

        // ── Dropdown helpers (anchored panels instead of full-screen windows) ──
        function _closeAllDropdowns() {
            $('.ms-dropdown').css('display', 'none');
        }

        // Show a dropdown panel anchored to its label; opens below if there is room, else above.
        function openDropdown(panelSel, anchorEl, listSel) {
            _closeAllDropdowns();

            var $panel = $(panelSel);
            var $list = $(listSel);

            // Clear any cap left over from a previous open so the CSS default applies again
            $list.css('max-height', '');

            var rect = anchorEl.getBoundingClientRect();
            var vw = window.innerWidth, vh = window.innerHeight, margin = 6;

            // Width: use the full available screen width so items don't wrap
            var width = vw - 2 * margin;

            // Render hidden first so we can measure its height
            $panel.css({ display: 'block', width: width + 'px', left: '0px', top: '0px', visibility: 'hidden' });
            var ph = $panel.outerHeight();

            // Horizontal: full width, just pinned inside the screen
            var left = margin;

            // Vertical: open on whichever side has more room.
            var spaceBelow = vh - rect.bottom - margin;
            var spaceAbove = rect.top - margin;
            var top;

            if (ph <= spaceBelow) {
                top = rect.bottom + 2;                 // fits below
            } else if (ph <= spaceAbove) {
                top = rect.top - ph - 2;               // fits above
            } else {
                // Neither side fits the full list -> use the bigger side and let the list scroll.
                // Cap the LIST (the shell is overflow:hidden, so the list is what scrolls).
                var overhead = ph - $list.outerHeight();   // search box + borders, etc.
                if (spaceBelow >= spaceAbove) {
                    $list.css('max-height', Math.max(60, spaceBelow - overhead - 4) + 'px');
                    top = rect.bottom + 2;
                } else {
                    $list.css('max-height', Math.max(60, spaceAbove - overhead - 4) + 'px');
                    top = margin;                          // pinned to top, grows down to the label
                }
            }

            $panel.css({ left: left + 'px', top: top + 'px', visibility: 'visible' });

            // Highlight the first row, same as before
            if (listSel) {
                $(listSel + ' .k-listview-item:first').css({
                    "font-weight": "bold",
                    "background-color": "#f0f8ff"
                });
            }
        }

        function closeDropdown(panelSel) {
            $(panelSel).css('display', 'none');
        }

            $("#lstDealerName").kendoListView({

                    g_productUrl = '../api/ProductsWithOrders?DepotID=' + localStorage.getItem("DepotID")

                    $('#dvProduct1,#dvProduct2,#dvProduct3').html('');
                    g_maxBags = { 1: 0, 2: 0, 3: 0 };

        function delay(callback, ms) {
            var timer = 0;
            return function () {
                var context = this, args = arguments;
                clearTimeout(timer);
                timer = setTimeout(function () {
                    callback.apply(context, args);
                }, ms || 0);
            };
        }

        function extractMetadata(file) {
            const reader = new FileReader();
            reader.readAsArrayBuffer(file);
            reader.onload = function (event) {
                const exifData = EXIF.readFromBinaryFile(event.target.result);

                const latitude = exifData?.GPSLatitude ? convertToDecimal(exifData.GPSLatitude, exifData.GPSLatitudeRef).toFixed(2) : "N/A";
                const longitude = exifData?.GPSLongitude ? convertToDecimal(exifData.GPSLongitude, exifData.GPSLongitudeRef).toFixed(2) : "N/A";
                const dateTime = exifData?.DateTimeOriginal ? formatDateTime(exifData.DateTimeOriginal) : "N/A";
                //  const isRealImage = (latitude !== "N/A" && longitude !== "N/A") ? "✅ Real Image" : "❌ Fake Image (No GPS Data)";
                /*<br>📍 <b>Location:</b> ${latitude}, ${longitude}*/
                /*  `📅 <b>Date/Time:</b> ${dateTime}<br>*/
                document.getElementById("metadata").innerHTML =
                    `📅 <b>Date/Time:</b><br> <span id="image_datetime"></span>    <br>
                                    <div style="display:none"> <b>🌍 Dist. from Depot:</b> <span id="distance_from_depot"></span>
                                    <br>📝 <b>Image Authenticity:</b> <span id="image_authenticity"></span></div>`;

                if (latitude !== "N/A" && longitude !== "N/A") {
                    calculateDistance(latitude, longitude);
                }

            };
        }

        function convertToDecimal(coord, ref) {
            const decimal = coord[0] + (coord[1] / 60) + (coord[2] / 3600);
            return (ref === "S" || ref === "W") ? -decimal : decimal;
        }

        function calculateDistance(lat1, lon1) {
            const R = 6371000;
            const lat1Rad = lat1 * Math.PI / 180;
            const lon1Rad = lon1 * Math.PI / 180;
            const lat2Rad = BASE_LAT * Math.PI / 180;
            const lon2Rad = BASE_LON * Math.PI / 180;

            const dLat = lat2Rad - lat1Rad;
            const dLon = lon2Rad - lon1Rad;

            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1Rad) * Math.cos(lat2Rad) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);

            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            const distance = (R * c);
            const distanceKM = (R * c) / 1000;

            //// Show in alert
            //alert(
            //    `Depot Coordinates: ${BASE_LAT}, ${BASE_LON}\n` +
            //    `Mobile Coordinates: ${lat1}, ${lon1}\n` +
            //    `Distance: ${distance.toFixed(2)} meters`
            //);


            document.getElementById("distance_from_depot").innerText = `${distanceKM.toFixed(2)} km.`;
            //if (distance > 6000000) {
            //    $("#dvWarning").show();
            //    playWarning();
            //    $("#dvAwayMessage").html("<b> You are currently away from the depot.</b>");
            //    speakText("You are away from the depot");
            //    $("#dvAwayMessage").show();
            //}
            let depotId = parseInt(localStorage.getItem("DepotID"), 10);
            let threshold;

            if (depotId === 1430) {
                threshold = 100;
            } else {
                threshold = 100;
            }

            if (distance > threshold) {
                $("#dvWarning").show();
                playWarning();
                $("#dvAwayMessage").html("<b>You are currently away from the depot.</b>");
                speakText("You are away from the depot");
                $("#dvAwayMessage").show();
            }
        }



        function compressAndUpload(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);

                reader.onload = function (event) {
                    const img = new Image();
                    img.src = event.target.result;

                    img.onload = function () {
                        const canvas = document.createElement("canvas");
                        const ctx = canvas.getContext("2d");
                        canvas.width = 700;
                        canvas.height = 700;
                        ctx.drawImage(img, 0, 0, 700, 700);

                        canvas.toBlob(async function (blob) {
                            document.getElementById("preview").src = URL.createObjectURL(blob);
                            const formData = new FormData();
                            formData.append("image", blob, "compressed_image.jpg");

                            try {
                                document.getElementById("registration_number").innerText = "Processing...";
                                document.getElementById("dvProcessing").innerText = "Registration Number Processing...";

                                const response = await fetch("/api/VehicleNumberExtractor/license-plate", {
                                    method: "POST",
                                    body: formData
                                });

                                const data = await response.json();
                                document.getElementById("dvProcessing").innerText = "";
                                document.getElementById("registration_number").innerText = " " + data.registration_number;
                                var cleanTruckNo = sanitizeTruckNumber(data.registration_number);
                                $("#txtTruckNumber").val(cleanTruckNo);
                                //$("#txtTruckNumber").val(data.registration_number);

                                if (data.registration_number.includes("unable to")) {
                                    $("#dvTruckNumberMessage").html("<b>" + data.registration_number + "</b>");
                                }
                            } catch (error) {
                                console.error("Error:", error);
                                document.getElementById("registration_number").innerText = "Error extracting registration number.";
                            } finally {
                                resolve(); // <- this tells the await to continue
                            }
                        }, "image/jpeg", 1.0);
                    };

                    img.onerror = () => reject(new Error("Image failed to load"));
                };

                reader.onerror = () => reject(new Error("File could not be read"));
            });
        }

        function formatDateTime(dateTime) {
            // ✅ Guard against undefined / unexpected formats so a missing
            //    EXIF/Metadata date never throws "Cannot read properties of undefined".
            if (!dateTime || typeof dateTime !== 'string' || dateTime.indexOf(' ') === -1) {
                return "";
            }

            const [date, time] = dateTime.split(' ');
            const [year, month, day] = date.split(':');
            const [hours, minutes] = time.split(':');

            return `${day}/${month}/${year} ${hours}:${minutes}`;
        }

                TruckPhotoFileName: vTruckPhotoFileName,
                TruckNumber: vTruckNumber,
                SoldToParty: vSoldToParty,
                SoldToPartyID: vSoldToPartyID,
                DriverName: vDriverName,
                DriverMobileNo: vDriverMobileNo,
                TransporterType: vTransporterType,
                CreatedBy: vCreatedBy
            };

            let apiUrl = "/api/SalesRequestNew/VerifyOrder";

            if (vSource === "tpsales") {
                // TPSales → only Product1  + DA
                apiUrl = "/api/SalesRequestNew/VerifyOrderTPSales";
                verifyOrderParam.DA = vDA;
                verifyOrderParam.ProductID1 = vProductID1;
                verifyOrderParam.TotalQty1 = vQuantity1;
            }
            else if (validOrderId) {

                // validOrderId → only Product1 + validOrderId
                apiUrl = "/api/SalesRequestNew/VerifyOrderPendingOrder";
                verifyOrderParam.OrderNumber = vOrderNumber;
                verifyOrderParam.ProductID1 = vProductID1;
                verifyOrderParam.TotalQty1 = vQuantity1;
            }

            else {
                // Normal →  all 3 products
                verifyOrderParam.ProductID1 = vProductID1;
                verifyOrderParam.TotalQty1 = vQuantity1;
                verifyOrderParam.ProductID2 = vProductID2;
                verifyOrderParam.TotalQty2 = vQuantity2;
                verifyOrderParam.ProductID3 = vProductID3;
                verifyOrderParam.TotalQty3 = vQuantity3;
            }

            $.ajax({
                // url: "/api/SalesRequestNew/VerifyOrder",
                url: apiUrl,
                type: "POST",
                contentType: "application/json",
                data: JSON.stringify(verifyOrderParam),
                success: function (response) {
                    console.log("API Response:", response);

                    if (response?.response?.SaleRequestID) {
                        $("#hdnSaleRequestID").val(response.response.SaleRequestID);
                    }

                    function updateIcons(index, res) {
                        const salesOrderVerified = res[`SalesOrderVerified${index}`];
                        const stockVerified = res[`StockVerified${index}`];

                        const productIconSpan = document.getElementById(`product${index}-check`);
                        const quantityIconSpan = document.getElementById(`quantity${index}-check`);

                        //fetch productId & quantity using earlier logic
                        const productId = $(`#dvProduct${index}`).html()?.split(' | ')[0] || "";
                        const quantity = $(`#txtQuantity${index}`).val() || "0";

                        if (!productIconSpan || !quantityIconSpan) {
                            console.warn(`Icon span(s) not found for index ${index}`);
                            return;
                        }

                        // Clear icons
                        productIconSpan.innerHTML = "";
                        quantityIconSpan.innerHTML = "";

                        // Apply basic styling for alignment
                        productIconSpan.style.display = "flex";
                        productIconSpan.style.alignItems = "center";
                        quantityIconSpan.style.display = "flex";
                        quantityIconSpan.style.alignItems = "center";

                        if (salesOrderVerified === false && productId !== "") {
                            productIconSpan.innerHTML = `<span class="red-cross">❌</span>`;
                        }

                        if (salesOrderVerified === true && stockVerified === true) {
                            quantityIconSpan.innerHTML = `<span class="green-tick">✔</span>`;
                            sendDriverOTP();
                            $("#btnVerifyOrder").hide();
                            $("#txtOTP").show();
                            // $("#btnSubmit").removeClass("disabled").addClass("submit").removeAttr("disabled");
                            disableControls();
                        }

                        // If stock verification failed, show only red box icon at quantity
                        if (stockVerified === false && parseFloat(quantity) > 0) {
                            quantityIconSpan.innerHTML = `
                                             <span class="red-cross">❌</span>`;
                        }

                        console.log(`Updated: product${index} (SalesOrderVerified=${salesOrderVerified}), quantity${index} (StockVerified=${stockVerified})`);
                    }


                    updateIcons(1, response.response);
                    updateIcons(2, response.response);
                    updateIcons(3, response.response);

                    $btn.prop('disabled', false).text('Verify Order');
                },
                error: function (xhr, status, error) {
                    console.error("Error:", xhr.responseText);
                    alert("Error occurred: " + xhr.responseText);
                    $btn.prop('disabled', false).text('Verify Order');
                }
            });
        });

        function sendDriverOTP() {
            var vTruckNumber = $("#registration_number").text();
            var vDriverMobileNo = $("#txtDriverMobile").val();
            var vSaleRequestID = $("#hdnSaleRequestID").val();

            var allProductIDs = [];
            var allQuantities = [];

            // Check Product 1
            if ($("#quantity1-check .green-tick").text().trim() === "✔") {
                var productId1 = $('#dvProduct1').html()?.split(' | ')[0] || "";
                var qty1 = $("#txtQuantity1").val().trim();
                if (productId1 && qty1) {
                    allProductIDs.push(productId1);
                    allQuantities.push(qty1);
                }
            }

            // Check Product 2
            if ($("#quantity2-check .green-tick").text().trim() === "✔") {
                var productId2 = $('#dvProduct2').html()?.split(' | ')[0] || "";
                var qty2 = $("#txtQuantity2").val().trim();
                if (productId2 && qty2) {
                    allProductIDs.push(productId2);
                    allQuantities.push(qty2);
                }
            }

            // Check Product 3
            if ($("#quantity3-check .green-tick").text().trim() === "✔") {
                var productId3 = $('#dvProduct3').html()?.split(' | ')[0] || "";
                var qty3 = $("#txtQuantity3").val().trim();
                if (productId3 && qty3) {
                    allProductIDs.push(productId3);
                    allQuantities.push(qty3);
                }
            }

            if (allProductIDs.length === 0 || allQuantities.length === 0) {
                alert("Please select at least one product with ✔ and provide quantity.");
                return;
            }

            const data = {
                saleRequestID: vSaleRequestID,
                mobileNumber: vDriverMobileNo,
                truckNo: vTruckNumber,
                item: allProductIDs.join(','),
                bags: allQuantities.join(',')
            };

            $.ajax({
                url: "/api/OTP/SendSalesRequestOtp",
                type: "POST",
                contentType: "application/json",
                data: JSON.stringify(data),
                success: function (response) {
                    console.log("OTP:", response.otp);
                    console.log("SMS Results:", response.status);
                    sessionStorage.setItem("TruckOTP", response.otp);
                },
                error: function (xhr) {
                    console.log("Error:", xhr.responseText);
                    alert("Error sending OTP: " + xhr.responseText);
                }
            });
        }
