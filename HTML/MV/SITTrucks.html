    <script>
        $(document).ready(function () {
            
            fnSetPageName("SIT Trucks");
            getSAPLastImportTime('SAPSIT');
            function setListViewHeight() {
                var availableHeight = $(window).height()
                    - $("#header").outerHeight(true)   // subtract header
                    - $("#refresh-panel").outerHeight(true) // subtract refresh panel
                    - $("#footer").outerHeight(true)   // subtract footer
                    - 68; // small padding margin

                $("#lstSaleInvoiceDetail").height(availableHeight);
            }



            $("#lstSaleInvoiceDetail").kendoListView({
                dataSource: {
                    transport: {
                        read: {
                            url: '/api/PlantTruck/GetSITTruck?UserId=' + getUserID() + '&DepotID=' + getDepotID(),
                            dataType: "json"
                        }
                    },
                    schema: {
                        data: function (response) {
                            return response;
                        }
                    },
                    sort: { field: "DADate", dir: "asc" } // Sort ascending by LorryNumber
                },
                template: kendo.template($("#tmpSaleInvoiceDetailCollaps").html()),
                selectable: "single",
                change: function (e) { },
                dataBound: function () {
                    var listView = $("#lstSaleInvoiceDetail").data("kendoListView");

                    $.each($("#lstSaleInvoiceDetail.k-listview")
                        .find("div.k-listview-content")
                        .find("div.k-listview-item"), function (k, i) {

                            var dataItem = listView.dataItem($(i));

                            $(i).kendoExpansionPanel({
                                title: 'ssss',
                                subTitle: '',
                                complete: function (e) {
                                    let dataItem = listView.dataItem($(e.sender.element));
                                    var template = kendo.template($("#tmpSaleInvoiceDetailExpand").html());
                                    e.sender.element.closest(".k-expander")
                                        .find("div.k-expander-header .k-expander-title")
                                        .html(template(dataItem));

                                    e.sender.element.closest(".k-expander")
                                        .find("div.k-expander-header")
                                        .css({
                                            'border-bottom': '0px solid',
                                            'border-bottom-color': '#E0E0E0',
                                            'padding-bottom': '10px'
                                        });
                                }
                            });
                            
                            if (dataItem.IsDedicatedTruck) {
                                $(i).closest(".k-expander").addClass("dedicated-row");
                            }
                        });
                }


                //dataBound: function () {
                //    $.each($("#lstSaleInvoiceDetail.k-listview").find("div.k-listview-content").find("div.k-listview-item"), function (k, i) {
                //        $(i).kendoExpansionPanel({
                //            title: 'ssss',
                //            subTitle: '',
                //            complete: function (e) {
                //                let dataItem = $("#lstSaleInvoiceDetail").data("kendoListView").dataItem($(e.sender.element));
                //                var template = kendo.template($("#tmpSaleInvoiceDetailExpand").html());
                //                var data = dataItem;
                //                e.sender.element.closest("div.k-expander-content-wrapper").closest("div.k-expander")
                //                    .find("div.k-expander-header").find("div.k-expander-title").html(template(data));

                //                e.sender.element.closest("div.k-expander-content-wrapper").closest("div.k-expander")
                //                    .find("div.k-expander-header").css({
                //                        'border-bottom': '0px solid',
                //                        'border-bottom-color': '#E0E0E0',
                //                        'padding-bottom': '10px'
                //                    });
                //            }
                //        });
                //    });
                //}
            });

            setListViewHeight();
            $(window).resize(setListViewHeight);

            if (isAllowed) {
                document.getElementById("sapSection").style.display = "block";
            }
        });

        const currentUrl = window.location.href;
        function getDepotID() {
            return localStorage.getItem("DepotID").toString();
        }
        function getUserID() {
            return localStorage.getItem("userID").toString();
        }

        function onDedicatedTruckClick(event, checkboxElement, GRNIDList) {
            event.stopPropagation();
            //alert(GRNIDList);
            const isChecked = checkboxElement.checked;
            const userId = getUserID();

            $.ajax({
                type: "POST",
                url: "/api/PlantTruck/UpdateDedicatedTruckStatus",
                contentType: "application/json",
                data: JSON.stringify({
                    GRNIDList: GRNIDList,
                    IsDedicatedTruck: isChecked,
                    UserID: userId
                }),
                success: function (response) {
                    alert("Updated successfully:", response.message);
                    const listView = $("#lstSaleInvoiceDetail").data("kendoListView");
                    if (listView) {
                        listView.dataSource.read();
                        listView.refresh();
                    }
                },
                error: function (xhr, status, error) {
                    console.error("Update failed:", xhr.responseJSON?.message || error);
                }
            });
        }
        function applyDedicatedTruckPermission(grnID) {
            const isAllowed = localStorage.getItem("IsAllowedDedicatedTruckStatusChange") === "true";
            // alert(isAllowed);
            const checkbox = document.getElementById(`chkIsDedicatedTruck_${grnID}`);

            if (checkbox) {
                checkbox.disabled = !isAllowed;
            }
        }

        $("#btnRefresh").on("click", async function () {
            var $btn = $(this); // ✅ capture 'this' immediately before any await

            let diffMinutes;
            try {
                diffMinutes = await getSAPLastImportTime('SAPSIT');
            } catch (err) {
                console.error("Error fetching last import time:", err);
                diffMinutes = 9999;
            }

            if (diffMinutes <= 10) {
                alert("Last import was just " + diffMinutes + " minute(s) ago. Please wait before refreshing again.");
                return;
            }

            $btn.prop("disabled", true).text("Refreshing...");

            $.ajax({
                url: "/api/Flow/trigger",
                type: "POST",
                contentType: "application/json",
                data: JSON.stringify({ FlowId: "SAP-SIT-DOWNLOAD" }),
                success: function (response) {
                    console.log("Flow Triggered:", response);
                    var listView = $("#lstSaleInvoiceDetail").data("kendoListView");
                    if (listView) listView.dataSource.read();
                },
                error: function (xhr, status, error) {
                    console.error("Error triggering flow:", error);
                    alert("Failed to trigger flow.");
                },
                complete: function () {
                    setTimeout(function () {
                        var listView = $("#lstSaleInvoiceDetail").data("kendoListView");
                        if (listView) listView.dataSource.read();
                        $btn.prop("disabled", false).text("Refresh");
                    }, 60000);
                }
            });
        });

        function getSAPLastImportTime(source) {
            $("#dvLastupdatedTime").html('');
            return new Promise(function (resolve, reject) {
                $.ajax({
                    url: "/api/flow/sap-last-import",
                    type: "GET",
                    data: { source: source },
                    success: function (response) {
                        if (response.status === "Success" || response.Status === "Success") {
                            $("#dvLastupdatedTime").html(response.whatsAppStyleTime ?? response.WhatsAppStyleTime);

                            // ✅ Handle both camelCase and PascalCase
                            let rawTime = response.actualTime ?? response.ActualTime;
                            let actualTime = new Date(rawTime);
                            let now = new Date();
                            let diffMinutes = Math.floor((now - actualTime) / 60000);

                            console.log("WhatsApp-style time:", response.whatsAppStyleTime ?? response.WhatsAppStyleTime);
                            console.log("Actual datetime:", rawTime);
                            console.log("Difference in minutes:", diffMinutes);

                            resolve(diffMinutes);
                        } else {
                            reject(response.message ?? response.Message);
                        }
                    },
                    error: function (xhr) {
                        reject(xhr.responseText);
                    }
                });
            });
        }

    </script>
