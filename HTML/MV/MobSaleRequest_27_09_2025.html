    <script type="text/kendo-x-tmpl" id="tmpDealer">
        <div style="border-bottom: 1px solid lightgrey;padding:5px;">

    <script type="text/kendo-x-tmpl" id="tmpProduct">
        <div style="border-bottom: 1px solid lightgrey;padding:5px;">
            <div style="display:table-cell;padding: 5px 10px;width:140px;">#: data.ProductID #</div>
            <div style="display:table-cell;padding: 5px 10px;">#: data.ProductDesc #</div>

    <script>
        var Product1, Product2, Product3 = undefined;
        //const BASE_LAT = 9.9252;
        //const BASE_LON = 78.1198;
        //Madurai
        
        var BASE_LAT = parseFloat(localStorage.getItem("DepotLatitude"));
        var BASE_LON = parseFloat(localStorage.getItem("DepotLongitude"));




        $(document).ready(function () {

            $("#txtQuantity1").kendoNumericTextBox({
                format: "n0",       // no decimals
                min: 0,
                max: 100000,
                step: 1,
                spinners: false
            });

            $("#txtQuantity2").kendoNumericTextBox({
                format: "n0",
                min: 0,
                max: 100000,
                step: 1,
                spinners: false
            });

            $("#txtQuantity3").kendoNumericTextBox({
                format: "n0",
                min: 0,
                max: 100000,
                step: 1,
                spinners: false
            });


            $("#dvDealerName").kendoTouch({
                tap: function (e) {
                    $("#kwDealerName").data("kendoWindow").open();
                }
            });

            $("#dvProductTouch1").kendoTouch({
                tap: function (e) {
                    DealerData = undefined
                    $("#kwProduct1").data("kendoWindow").open();
                }
            });

            $("#dvProductTouch2").kendoTouch({
                tap: function (e) {
                    DealerData = undefined
                    $("#kwProduct2").data("kendoWindow").open();
                }
            });

            $("#dvProductTouch3").kendoTouch({
                tap: function (e) {
                    DealerData = undefined
                    $("#kwProduct3").data("kendoWindow").open();
                }
            });

            $("#txtDealerName").keyup(function () {
                var value = $(this).val();
                var listView = $("#lstDealerName").data("kendoListView");

                if (value) {
                    listView.dataSource.filter({
                        //field: "Customer",   // Change this to the actual field name in your data
                        //operator: "contains",
                        //value: value

                        logic: "or",
                        filters: [
                            { field: "SoldToPt", operator: "contains", value: value },
                            { field: "Customer", operator: "contains", value: value }
                        ]
                    });

                    //logic: "and" | "or",
                    //    filters: [
                    //        { field: "field1", operator: "eq", value: "value1" },
                    //        { field: "field2", operator: "contains", value: "value2" }
                    //    ]
                } else {
                    // Clear filter if input is empty
                    listView.dataSource.filter({});
                }
            });

            $("#lstDealerName").kendoListView({
                dataSource: {
                    transport: {
                        read: {
                            url: '../api/Mob_RetrieveDealersFromDepotCustomerMap?DepotID=' + localStorage.getItem("DepotID"),
                            dataType: "json"
                        }
                    }, sort: { field: "Customer", dir: "asc" }
                },
                template: kendo.template($("#tmpDealer").html()),
                selectable: "single",
                change: function (e) {
                    // get ListView selection
                    var selectedItems = e.sender.select();
                    var dataItem = $("#lstDealerName").data("kendoListView").dataItem(selectedItems);
                    $(".clsbtnDealer").show();
                    $("#btnVerifyOrder").removeClass("disabled").addClass("VERIFY").removeAttr("disabled");



                    $('#dvDealer').html(dataItem.SoldToParty);
                    $("#kwDealerName").data("kendoWindow").close();
                }
            });

            $("#lstProduct1").kendoListView({
                dataSource: {
                    transport: {
                        read: {
                            url: '../api/DealerMob',
                            dataType: "json"
                        }
                    }, sort: { field: "RowNum", dir: "asc" }
                },
                template: kendo.template($("#tmpProduct").html()),
                selectable: "single",
                change: function (e) {
                    // get ListView selection
                    var selectedItems = e.sender.select();
                    var dataItem = $("#lstProduct1").data("kendoListView").dataItem(selectedItems);
                    Product1 = dataItem.ProductID;
                    $(".clsbtnProduct1").show();
                    // alert(dataItem.ProductIDwithDesc);
                    if (dataItem.ProductIDwithDesc === 'SELECT' || dataItem.ProductIDwithDesc === 'Select') {
                        $('#dvProduct1').html('');
                    } else {
                        $('#dvProduct1').html(dataItem.ProductIDwithDesc);
                    }
                    $("#kwProduct1").data("kendoWindow").close();

                    _listProductAppend(1);
                }
            });

            var lstProduct1 = $("#lstProduct1").data("kendoListView");
            lstProduct1.select(lstProduct1.content.children().first());



            $("#lstProduct2").kendoListView({
                dataSource: {
                    transport: {
                        read: {
                            url: '../api/DealerMob',
                            dataType: "json"
                        }
                    }, sort: { field: "RowNum", dir: "asc" }
                },
                template: kendo.template($("#tmpProduct").html()),
                selectable: "single",
                change: function (e) {
                    // get ListView selection
                    var selectedItems = e.sender.select();
                    var dataItem = $("#lstProduct2").data("kendoListView").dataItem(selectedItems);
                    Product2 = dataItem.ProductID;
                    $(".clsbtnProduct2").show();
                    if (dataItem.ProductIDwithDesc === 'SELECT' || dataItem.ProductIDwithDesc === 'Select') {
                        $('#dvProduct2').html('');
                    } else {
                        $('#dvProduct2').html(dataItem.ProductIDwithDesc);
                    }
                    $("#kwProduct2").data("kendoWindow").close();
                    _listProductAppend(2);
                }
            });

            var lstProduct2 = $("#lstProduct2").data("kendoListView");
            lstProduct2.select(lstProduct2.content.children().first());


            $("#lstProduct3").kendoListView({
                dataSource: {
                    transport: {
                        read: {
                            url: '../api/DealerMob',
                            dataType: "json"
                        }
                    }, sort: { field: "RowNum", dir: "asc" }
                },
                template: kendo.template($("#tmpProduct").html()),
                selectable: "single",
                change: function (e) {
                    // get ListView selection
                    var selectedItems = e.sender.select();
                    var dataItem = $("#lstProduct3").data("kendoListView").dataItem(selectedItems);
                    Product3 = dataItem.ProductID;
                    $(".clsbtnProduct3").show();
                    if (dataItem.ProductIDwithDesc === 'SELECT' || dataItem.ProductIDwithDesc === 'Select') {
                        $('#dvProduct3').html('');
                    } else {

        function delay(callback, ms) {
            var timer = 0;
            return function () {

                timer = setTimeout(function () {
                    callback.apply(context, args);
                }, ms || 0);
            };
        }

        function extractMetadata(file) {
            const reader = new FileReader();
            reader.readAsArrayBuffer(file);
            reader.onload = function (event) {
                const exifData = EXIF.readFromBinaryFile(event.target.result);

                const latitude = exifData?.GPSLatitude ? convertToDecimal(exifData.GPSLatitude, exifData.GPSLatitudeRef).toFixed(2) : "N/A";
                const longitude = exifData?.GPSLongitude ? convertToDecimal(exifData.GPSLongitude, exifData.GPSLongitudeRef).toFixed(2) : "N/A";
                const dateTime = exifData?.DateTimeOriginal ? formatDateTime(exifData.DateTimeOriginal) : "N/A";
                //  const isRealImage = (latitude !== "N/A" && longitude !== "N/A") ? "✅ Real Image" : "❌ Fake Image (No GPS Data)";
                /*<br>📍 <b>Location:</b> ${latitude}, ${longitude}*/
                /*  `📅 <b>Date/Time:</b> ${dateTime}<br>*/
                document.getElementById("metadata").innerHTML =
                    `📅 <b>Date/Time:</b><br> <span id="image_datetime"></span>    <br>
                                <div style="display:none"> <b>🌍 Dist. from Depot:</b> <span id="distance_from_depot"></span>
                                <br>📝 <b>Image Authenticity:</b> <span id="image_authenticity"></span></div>`;

                if (latitude !== "N/A" && longitude !== "N/A") {
                    calculateDistance(latitude, longitude);
                }

            };
        }

        function convertToDecimal(coord, ref) {
            const decimal = coord[0] + (coord[1] / 60) + (coord[2] / 3600);
            return (ref === "S" || ref === "W") ? -decimal : decimal;
        }

        function calculateDistance(lat1, lon1) {
            const R = 6371000;
            const lat1Rad = lat1 * Math.PI / 180;
            const lon1Rad = lon1 * Math.PI / 180;
            const lat2Rad = BASE_LAT * Math.PI / 180;
            const lon2Rad = BASE_LON * Math.PI / 180;

            const dLat = lat2Rad - lat1Rad;
            const dLon = lon2Rad - lon1Rad;

            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1Rad) * Math.cos(lat2Rad) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);

            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            const distance = (R * c);
            const distanceKM = (R * c) / 1000;

            //// Show in alert
            //alert(
            //    `Depot Coordinates: ${BASE_LAT}, ${BASE_LON}\n` +
            //    `Mobile Coordinates: ${lat1}, ${lon1}\n` +
            //    `Distance: ${distance.toFixed(2)} meters`
            //);


            document.getElementById("distance_from_depot").innerText = `${distanceKM.toFixed(2)} km.`;
            //if (distance > 6000000) {
            //    $("#dvWarning").show();
            //    playWarning();
            //    $("#dvAwayMessage").html("<b> You are currently away from the depot.</b>");
            //    speakText("You are away from the depot");
            //    $("#dvAwayMessage").show();
            //}
            let depotId = parseInt(localStorage.getItem("DepotID"), 10);
            let threshold;

            if (depotId === 1430) {
                threshold = 6000000;
            } else {
                threshold = 200;
            }

            if (distance > threshold) {
                $("#dvWarning").show();
                playWarning();
                $("#dvAwayMessage").html("<b>You are currently away from the depot.</b>");
                speakText("You are away from the depot");
                $("#dvAwayMessage").show();
            }
        }



        function compressAndUpload(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);

                reader.onload = function (event) {
                    const img = new Image();
                    img.src = event.target.result;

                    img.onload = function () {
                        const canvas = document.createElement("canvas");
                        const ctx = canvas.getContext("2d");
                        canvas.width = 700;
                        canvas.height = 700;
                        ctx.drawImage(img, 0, 0, 700, 700);

                        canvas.toBlob(async function (blob) {
                            document.getElementById("preview").src = URL.createObjectURL(blob);
                            const formData = new FormData();
                            formData.append("image", blob, "compressed_image.jpg");

                            try {
                                document.getElementById("registration_number").innerText = "Processing...";
                                document.getElementById("dvProcessing").innerText = "Registration Number Processing...";

                                const response = await fetch("/api/VehicleNumberExtractor/license-plate", {
                                    method: "POST",
                                    body: formData
                                });

                                const data = await response.json();
                                document.getElementById("dvProcessing").innerText = "";
                                document.getElementById("registration_number").innerText = " " + data.registration_number;
                                $("#txtTruckNumber").val(data.registration_number);

                                if (data.registration_number.includes("unable to")) {
                                    $("#dvTruckNumberMessage").html("<b>" + data.registration_number + "</b>");
                                }
                            } catch (error) {
                                console.error("Error:", error);
                                document.getElementById("registration_number").innerText = "Error extracting registration number.";
                            } finally {
                                resolve(); // <- this tells the await to continue
                            }
                        }, "image/jpeg", 1.0);
                    };

                    img.onerror = () => reject(new Error("Image failed to load"));
                };

                reader.onerror = () => reject(new Error("File could not be read"));
            });
        }

        }

                        const stockVerified = res[`StockVerified${index}`];

                        const productIconSpan = document.getElementById(`product${index}-check`);
                        const quantityIconSpan = document.getElementById(`quantity${index}-check`);

                        if (!productIconSpan || !quantityIconSpan) {
                            console.warn(`Icon span(s) not found for index ${index}`);
                            return;
                        }

                        // Clear icons
                        productIconSpan.innerHTML = "";
                        quantityIconSpan.innerHTML = "";

                        // Apply basic styling for alignment
                        productIconSpan.style.display = "flex";
                        productIconSpan.style.alignItems = "center";
                        quantityIconSpan.style.display = "flex";
                        quantityIconSpan.style.alignItems = "center";

                        if (salesOrderVerified === false) {
                            productIconSpan.innerHTML = `<span class="red-cross">❌</span>`;
                        }

                        if (salesOrderVerified === true && stockVerified === true) {
                            quantityIconSpan.innerHTML = `<span class="green-tick">✔</span>`;
                            sendDriverOTP();                            
                            $("#btnVerifyOrder").hide();
                            $("#txtOTP").show();
                           // $("#btnSubmit").removeClass("disabled").addClass("submit").removeAttr("disabled");
                            disableControls();
                        }

                        // If stock verification failed, show only red box icon at quantity
                        if (stockVerified === false) {
                            quantityIconSpan.innerHTML = `
                                         <span class="red-cross">❌</span>`;
                        }

                        console.log(`Updated: product${index} (SalesOrderVerified=${salesOrderVerified}), quantity${index} (StockVerified=${stockVerified})`);
                    }


                    updateIcons(1, response.response);
                    updateIcons(2, response.response);
                    updateIcons(3, response.response);

                    $btn.prop('disabled', false).text('Verify Order');
                },
                error: function (xhr, status, error) {
                    console.error("Error:", xhr.responseText);
                    alert("Error occurred: " + xhr.responseText);
                    $btn.prop('disabled', false).text('Verify Order');
                }
            });
        });

        function sendDriverOTP() {
            var vTruckNumber = $("#registration_number").text();
            var vDriverMobileNo = $("#txtDriverMobile").val();
            var vSaleRequestID = $("#hdnSaleRequestID").val();

            var allProductIDs = [];
            var allQuantities = [];

            // Check Product 1
            if ($("#quantity1-check .green-tick").text().trim() === "✔") {
                var productId1 = $('#dvProduct1').html()?.split(' | ')[0] || "";
                var qty1 = $("#txtQuantity1").val().trim();
                if (productId1 && qty1) {
                    allProductIDs.push(productId1);
                    allQuantities.push(qty1);
                }
            }

            // Check Product 2
            if ($("#quantity2-check .green-tick").text().trim() === "✔") {
                var productId2 = $('#dvProduct2').html()?.split(' | ')[0] || "";
                var qty2 = $("#txtQuantity2").val().trim();
                if (productId2 && qty2) {
                    allProductIDs.push(productId2);
                    allQuantities.push(qty2);
                }
            }

            // Check Product 3
            if ($("#quantity3-check .green-tick").text().trim() === "✔") {
                var productId3 = $('#dvProduct3').html()?.split(' | ')[0] || "";
                var qty3 = $("#txtQuantity3").val().trim();
                if (productId3 && qty3) {
                    allProductIDs.push(productId3);
                    allQuantities.push(qty3);
                }
            }

            if (allProductIDs.length === 0 || allQuantities.length === 0) {
                alert("Please select at least one product with ✔ and provide quantity.");
                return;
            }

            const data = {
                saleRequestID: vSaleRequestID,
                mobileNumber: vDriverMobileNo,
                truckNo: vTruckNumber,
                item: allProductIDs.join(','),
                bags: allQuantities.join(',')
            };

            $.ajax({
                url: "/api/OTP/SendSalesRequestOtp",
                type: "POST",
                contentType: "application/json",
                data: JSON.stringify(data),
                success: function (response) {
                    console.log("OTP:", response.otp);
                    console.log("SMS Results:", response.status);
                    sessionStorage.setItem("TruckOTP", response.otp);
                },
                error: function (xhr) {
                    console.log("Error:", xhr.responseText);
                    alert("Error sending OTP: " + xhr.responseText);
                }
            });
        }

        function validateOTP(enteredOTP) {
            const trimmedOTP = enteredOTP.trim();
            const storedOTP = sessionStorage.getItem("TruckOTP");

            if (!storedOTP) {
                alert("No OTP was previously stored.");
                return;
            }

            if (/^\d{4}$/.test(trimmedOTP)) {
                if (trimmedOTP === storedOTP) {
                   // alert("OTP is valid!");
                    $("#btnSubmit").removeClass("disabled").addClass("submit").removeAttr("disabled");
                    // Continue with next steps
                } else {
                    alert("Invalid OTP. Please try again.");
                }
            } else {
                alert("Please enter a 4-digit numeric OTP.");
            }
        }

        function handleOTPInput(input) {
            const enteredOTP = input.trim();
            if (enteredOTP.length === 4) {
                validateOTP(enteredOTP);
            }
        }
