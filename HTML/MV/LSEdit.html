    <script>
        var originalHandlingType = null;
        var originalLoadingData = null;
        var originalTranshipmentData = null;
        var defaultFormSnapshot = {};

        function _clearCombobox(e, param) {
            if (param == 'dvDA') {
                $("#lstDANo").data("kendoListView").clearSelection();
                $("#dvDA").html('');
                $(e).hide();
            }
        }

        const currentUrl = window.location.href;
        function getLSID() {
            const url = new URL(currentUrl);
            const params = new URLSearchParams(url.search);
            return params.get('LSID');
        }
        function isValidWeek(wk) {
            return /^\d{4}$/.test(wk);   // exactly 4 digits, leading zero allowed
        }

        function allowOnlyDigits(e) {
            var key = e.which || e.keyCode;

            // Allow: backspace, delete, tab, escape, enter
            if ([8, 9, 13, 27, 46].indexOf(key) !== -1) return true;

            // Allow: arrows (left, right, home, end)
            if (key >= 35 && key <= 39) return true;

            // Allow digits 0-9
            if (key >= 48 && key <= 57) return true;      // keyboard
            if (key >= 96 && key <= 105) return true;     // numpad

            e.preventDefault();
            return false;
        }


        function fnSubmit() {

            var vLSID = $("#hdnLSID").val();
            var vHandlingType = $("input[name=rdHandlingType]:checked").val();

            // Week No as STRING (allows leading zero)
            var vWk1 = $("#txtWeekNo1").val().trim();
            var vWk2 = $("#txtWeekNo2").val().trim();
            var vWk3 = $("#txtWeekNo3").val().trim();

            // Quantity as NUMBER
            var vQuantity1 = $("#txtQuantity1").data("kendoNumericTextBox").value();
            var vQuantity2 = $("#txtQuantity2").data("kendoNumericTextBox").value();
            var vQuantity3 = $("#txtQuantity3").data("kendoNumericTextBox").value();

            var vDANo = ($('#dvDA').html() || '').split(' | ')[0];
            var vCreatedBy = localStorage.getItem("userID");
            var vNotes = $("#txtNotes").val() || "";
            var originalDA = (originalTranshipmentData?.daText || "").trim();
            var currentDA = ($("#dvDA").html() || "").trim();

            var isHandlingTypeChanged = originalHandlingType && vHandlingType !== originalHandlingType;
            var isDAChanged = originalDA !== currentDA;

            /* =====================================================
               LOADING VALIDATIONS
               ===================================================== */
            if (vHandlingType === "L") {

                // ----- Mandatory Row 1 -----
                if (!vWk1 || !vQuantity1 || vQuantity1 <= 0) {
                    alert("Row 1: Week No and Quantity are mandatory.");
                    $("#txtWeekNo1").focus();
                    return false;
                }

                // ----- Week format (exactly 4 digits, leading zero allowed) -----
                var weekRegex = /^\d{4}$/;

                if (!weekRegex.test(vWk1)) {
                    alert("Row 1: Week No must be exactly 4 digits.");
                    $("#txtWeekNo1").focus();
                    return false;
                }

                if (vWk2 && !weekRegex.test(vWk2)) {
                    alert("Row 2: Week No must be exactly 4 digits.");
                    $("#txtWeekNo2").focus();
                    return false;
                }

                if (vWk3 && !weekRegex.test(vWk3)) {
                    alert("Row 3: Week No must be exactly 4 digits.");
                    $("#txtWeekNo3").focus();
                    return false;
                }

                // ----- Sequential rows -----
                if ((vWk2 || vQuantity2) && (!vWk1 || !vQuantity1)) {
                    alert("Please fill Row 1 before entering Row 2.");
                    $("#txtWeekNo1").focus();
                    return false;
                }

                if ((vWk3 || vQuantity3) && (!vWk2 || !vQuantity2)) {
                    alert("Please fill Row 2 before entering Row 3.");
                    $("#txtWeekNo2").focus();
                    return false;
                }

                // ----- Week & Qty pairing -----
                if ((vWk2 && (!vQuantity2 || vQuantity2 <= 0)) ||
                    (!vWk2 && vQuantity2 > 0)) {
                    alert("Row 2: Week No and Quantity must both be entered.");
                    $("#txtWeekNo2").focus();
                    return false;
                }

                if ((vWk3 && (!vQuantity3 || vQuantity3 <= 0)) ||
                    (!vWk3 && vQuantity3 > 0)) {
                    alert("Row 3: Week No and Quantity must both be entered.");
                    $("#txtWeekNo3").focus();
                    return false;
                }

                // ----- Duplicate Week No check -----
                var weeks = [];
                if (vWk1) weeks.push(vWk1);
                if (vWk2) weeks.push(vWk2);
                if (vWk3) weeks.push(vWk3);

                if (new Set(weeks).size !== weeks.length) {
                    alert("Duplicate Week No is not allowed.");
                    return false;
                }

                // ----- Total Qty MUST equal DA Qty -----
                var totalEnteredQty =
                    (vQuantity1 || 0) +
                    (vQuantity2 || 0) +
                    (vQuantity3 || 0);

                var daQty = parseInt($("#lblTotalQty").text(), 10) || 0;

                if (totalEnteredQty !== daQty) {
                    alert(
                        "Total Quantity (" + totalEnteredQty +
                        ") must be equal to DA Quantity (" + daQty + ")."
                    );
                    $("#txtQuantity1").data("kendoNumericTextBox").focus();
                    return false;
                }
            }

            // ----- Notes validation -----
            if (isHandlingTypeChanged || isDAChanged) {
                if (!vNotes.trim()) {
                    alert("Please enter Notes for changing Handling Type or DA.");
                    $("#txtNotes").focus();
                    return false;
                }
            }


            // ----- Payload -----
            var LSDet = {
                LSID: vLSID,
                HandlingType: vHandlingType,
                Wk1: vWk1 || "",
                Wk2: vWk2 || "",
                Wk3: vWk3 || "",
                Quantity1: vQuantity1 || 0,
                Quantity2: vQuantity2 || 0,
                Quantity3: vQuantity3 || 0,
                DANo: vDANo,
                UserID: vCreatedBy,
                Notes: vNotes
            };

            $.ajax({
                url: "/api/LoadingSlip/UpdateLSHandlingDetails",
                type: "POST",
                contentType: "application/json",
                data: JSON.stringify(LSDet),
                success: function (response) {
                    if (response.message === "SUCCESS") {
                        window.location.href = getOpenerPage();
                    } else {
                        alert(response.message);
                    }
                },
                error: function (xhr) {
                    console.error("Error:", xhr.responseText);
                    alert("Error occurred: " + xhr.responseText);
                }
            });
        }

        $(document).ready(function () {
            var freshStock = []; // Stores week-wise depot stock for selected product

            fnSetPageName("Edit Loading Slip");
            var LSID = getLSID();
            $("#hdnLSID").val(LSID);

            $("#txtWeekNo1").kendoTextBox({ maxLength: 4 });
            $("#txtWeekNo2").kendoTextBox({ maxLength: 4, enable: false });
            $("#txtWeekNo3").kendoTextBox({ maxLength: 4, enable: false });

            $("#txtWeekNo1").on("input", function () {
                if ($(this).val().length === 4) {
                    $("#txtWeekNo2").data("kendoTextBox").enable(true);
                } else {
                    $("#txtWeekNo2").data("kendoTextBox").enable(false);
                    $("#txtWeekNo3").data("kendoTextBox").enable(false);
                    $("#txtWeekNo2, #txtWeekNo3").val("");
                }
            });

            $("#txtWeekNo2").on("input", function () {
                if ($(this).val().length === 4) {
                    $("#txtWeekNo3").data("kendoTextBox").enable(true);
                } else {
                    $("#txtWeekNo3").data("kendoTextBox").enable(false);
                    $("#txtWeekNo3").val("");
                }
            });

            $("#txtWeekNo1, #txtWeekNo2, #txtWeekNo3")
                .on("keydown", allowOnlyDigits)
                .on("paste", function (e) {
                    var pasted = (e.originalEvent || e).clipboardData.getData('text');
                    if (!/^\d+$/.test(pasted)) {
                        e.preventDefault();
                    }
                });

            $("#txtWeekNo1, #txtWeekNo2, #txtWeekNo3").on("input", function () {
                this.value = this.value.replace(/\D/g, '').substring(0, 4);
            });


            $("#txtQuantity1").kendoNumericTextBox({
                decimals: 0,
                restrictDecimals: true,
                format: "0",       // no decimals
                min: 0,
                max: 9999,
                step: 1,
                spinners: false
            });

            $("#txtQuantity2").kendoNumericTextBox({
                decimals: 0,
                restrictDecimals: true,
                format: "0",       // no decimals
                min: 0,
                max: 9999,
                step: 1,
                spinners: false
            });

            $("#txtQuantity3").kendoNumericTextBox({
                decimals: 0,
                restrictDecimals: true,
                format: "0",       // no decimals
                min: 0,
                max: 9999,
                step: 1,
                spinners: false
            });

            $("#dvDA").kendoTouch({
                tap: function (e) {
                    $("#kwDANo").data("kendoWindow").open();
                }
            });

            $("#lstDANo").kendoListView({
                dataSource: {
                    transport: {
                        read: {
                            url: '../api/LoadingSlip/PendingDA?LSID=' + getLSID(),
                            dataType: "json"
                        }
                    },
                    sort: { field: "DA", dir: "asc" }
                },

                template: kendo.template($("#tmpDANo").html()),
                selectable: "single",
                change: function (e) {
                    var selectedItems = e.sender.select();
                    var dataItem = e.sender.dataItem(selectedItems);

                    $(".clsbtnDA").show();
                    $('#dvDA').html(dataItem.DALorryNo);
                    $("#kwDANo").data("kendoWindow").close();

                    // FORCE re-evaluation
                    if (!isInitialLoad && hasFormChangedFromDefault()) {
                        $("#btnLSEditApproval").show();
                        $("#trNotes").show();
                    }
                }
                ,

                dataBound: function (e) {
                    var data = e.sender.dataSource.view();

                    if (data.length === 0) {
                        $("#chkTranshipment").hide();
                        $("#dvTrpLbl").hide();
                    } else {
                        $("#chkTranshipment").show();
                        $("#dvTrpLbl").show();
                    }
                }
            });






            $("#kwDANo").kendoWindow({
                width: "90vw",
                height: "90vh",
                visible: false,
                modal: true
            }).data("kendoWindow").center();
            $("#kwDANo").attr("style", "padding:0px!important;");
            $("#kwDANo").closest("div.k-window").find("div.k-window-titlebar").find("span.k-window-title").html("");

            if (LSID) {
                $.ajax({
                    url: '../api/LoadingSlip/LSDetails?LSID=' + LSID,
                    type: 'GET',
                    dataType: 'json',
                    success: function (data) {
                        originalHandlingType = data.HandlingType || null;

                        // ----- SAVE ORIGINAL SNAPSHOT -----
                        originalLoadingData = {
                            wk1: data.WeekNo || "",
                            wk2: data.WeekNo2 || "",
                            wk3: data.WeekNo3 || "",
                            q1: data.Qty || null,
                            q2: data.Qty2 || null,
                            q3: data.Qty3 || null
                        };

                        originalTranshipmentData = {
                            daText: data.DANo
                                ? data.DANo + " | " + data.PlantTruckNumber
                                : ""
                        };

                        // ===== Info card - same fields/labels as the list & approval pages =====
                        var isListOrTL01 = (data.Operation === 'LIST' || data.Operation === 'TL01');
                        var isUnloading = (data.Operation === 'Unloading');
                        var canSAP = (data.Operation === 'Loading' || data.Operation === 'Transhipment');
                        // Strip the "(Bags ..)" part - Bags is shown separately on the same row
                        var weekText = (data.DAWeekNo || '').toString().replace(/\s*\(Bags[^)]*\)/g, '');

                        $('#lblLSNO').html(data.LSNO);
                        $('#spnTranDateDesc').html(data.TranDateDesc);

                        $('#lblDepotLorryNo').html(data.DepotLorryNo);
                        $('#lblOperation').html(data.Operation);
                        $('#lblTotalQty').html(data.TotalQty);

                        // Driver + Mob
                        $('#spnDriverName').text(data.DriverName || '');
                        $('#spnDriverMob').text(data.DriverMobileNo || '');

                        $('#spnDealerName').html(data.SoldToParty);
                        $('#lblProductID').html(data.ProductID);
                        $('#lblISDaWeek').html((data.ISDaWeek || '') + ":");
                        $('#lblDAWeekNo').html(weekText);

                        // Inv. No. + Inv. Dt (green) - only when invoiced
                        var hasInvoice = (data.InvoiceNo || '').toString().trim().length > 0;
                        if (hasInvoice) {
                            $('#spnInvoiceNo').text(data.InvoiceNo);
                            if (canSAP && (data.InvoiceDateDesc || '').toString().trim()) {
                                $('#spnInvoiceDateDesc').text(data.InvoiceDateDesc);
                                $('#spnInvDtWrap').show();
                            } else {
                                $('#spnInvDtWrap').hide();
                            }
                            $('#rowInv').show();
                        } else {
                            $('#rowInv').hide();
                        }

                        // Truck No hidden for Unloading / LIST / TL01
                        if (!isUnloading && !isListOrTL01) {
                            $('#wrapTruckNo').show();
                        } else {
                            $('#wrapTruckNo').hide();
                        }

                        // Bags next to Operation for LIST/TL01; Week row hidden for them
                        if (isListOrTL01) {
                            $('#lblOpBags').text(data.TotalQty);
                            $('#wrapOpBags').show();
                            $('#rowWeek').hide();
                        } else {
                            $('#wrapOpBags').hide();
                            $('#rowWeek').show();
                        }

                        // Dealer hidden for LIST/TL01 and Unloading
                        if (isListOrTL01 || isUnloading) {
                            $('#rowDealer').hide();
                        } else {
                            $('#rowDealer').show();
                        }

                        // Driver row hidden for Unloading (same as the list page)
                        if (isUnloading) {
                            $('#rowDriver').hide();
                        } else {
                            $('#rowDriver').show();
                        }

                        // Ref Doc + Delivery No hidden for LIST/TL01 and Unloading; red label when missing
                        if (isListOrTL01 || isUnloading) {
                            $('#rowRefDelivery').hide();
                        } else {
                            $('#spnReferenceDoc').text(data.ReferenceDoc || '');
                            $('#spnOrderNumber').text(data.OrderNumber || '');
                            var hasDelivery = (data.OrderNumber || '').toString().trim().length > 0;
                            $('#lblDelivery').css('color', hasDelivery ? '' : 'red');
                            $('#rowRefDelivery').show();
                        }

                        // Is LIST / Is Damaged flags
                        $('#rowIsList').toggle((data.IsLIST || '').toLowerCase() === 'yes');
                        $('#rowIsDamaged').toggle((data.IsDamaged || '').toLowerCase() === 'yes');
                        // ===== end info card =====

                        $('input[name=rdHandlingType]').each(function (e) {
                            if ($(this).val() === data.HandlingType) {
                                $(this).prop('checked', true);
                            }
                        })

                        if (data.HandlingType == "T") {
                            $("#dvDA").text(data.DANo + " | " + data.PlantTruckNumber);
                        }

                        if (data.HandlingType == "L") {
                            // WeekNo are Kendo TextBoxes
                            var wk1 = $("#txtWeekNo1").data("kendoTextBox");
                            var wk2 = $("#txtWeekNo2").data("kendoTextBox");
                            var wk3 = $("#txtWeekNo3").data("kendoTextBox");

                            if (wk1) wk1.value(data.WeekNo || "");
                            if (wk2) wk2.value(data.WeekNo2 || "");
                            if (wk3) wk3.value(data.WeekNo3 || "");

                            // Quantity are Kendo NumericTextBox
                            var qty1 = $("#txtQuantity1").data("kendoNumericTextBox");
                            var qty2 = $("#txtQuantity2").data("kendoNumericTextBox");
                            var qty3 = $("#txtQuantity3").data("kendoNumericTextBox");

                            if (qty1) qty1.value(data.Qty || 0);
                            if (qty2) qty2.value(data.Qty2 || 0);
                            if (qty3) qty3.value(data.Qty3 || 0);

                            // Optional: hide zero quantities
                            if (qty1 && qty1.value() === 0) qty1.value(null);
                            if (qty2 && qty2.value() === 0) qty2.value(null);
                            if (qty3 && qty3.value() === 0) qty3.value(null);
                        }


                        const tdDA = document.getElementById('dvDANo');
                        if (tdDA) {
                            tdDA.style.opacity = '0.5';
                            tdDA.style.backgroundColor = '#f0f0f0';
                        }
                        if (data.ProductID) {
                            loadFreshWeekStockHints(data.ProductID);
                        }
                        clkHandlingType();
                        setTimeout(function () {
                            captureDefaultSnapshot();
                            isInitialLoad = false;
                        }, 300);

                    },
                    error: function (xhr, status, error) {
                        console.error("Error fetching LS details:", error);
                    }
                });

            } else {
                console.warn("No LSID found in URL.");
            }
        });
        function restoreOriginalLoading() {
            $("#txtWeekNo1").data("kendoTextBox").value(originalLoadingData.wk1);
            $("#txtWeekNo2").data("kendoTextBox").value(originalLoadingData.wk2);
            $("#txtWeekNo3").data("kendoTextBox").value(originalLoadingData.wk3);

            $("#txtQuantity1").data("kendoNumericTextBox").value(originalLoadingData.q1);
            $("#txtQuantity2").data("kendoNumericTextBox").value(originalLoadingData.q2);
            $("#txtQuantity3").data("kendoNumericTextBox").value(originalLoadingData.q3);
        }

        function restoreOriginalTranshipment() {
            $("#dvDA").text(originalTranshipmentData.daText);
        }

        function clearLoadingFields() {
            $("#txtWeekNo1, #txtWeekNo2, #txtWeekNo3").val("");
            $("#txtQuantity1").data("kendoNumericTextBox").value(null);
            $("#txtQuantity2").data("kendoNumericTextBox").value(null);
            $("#txtQuantity3").data("kendoNumericTextBox").value(null);
        }

        function clkHandlingType() {
            var vHandlingType = $("input[name=rdHandlingType]:checked").val();

            // ----- PANEL TOGGLE -----
            if (vHandlingType === "L") {
                $("#lblDA").hide();
                $("#pnlLoadingWkQty").show();
                $("#pnlTranshipmentDA").hide();

                if (originalHandlingType === "L") {
                    restoreOriginalLoading();   // restore original
                } else {
                    clearLoadingFields();       // fresh entry
                }

            } else if (vHandlingType === "T") {
                $("#lblDA").show();
                $("#pnlLoadingWkQty").hide();
                $("#pnlTranshipmentDA").show();

                restoreOriginalTranshipment();  // always restore original T
            }

            // ----- NOTES LOGIC -----
            if (originalHandlingType && vHandlingType !== originalHandlingType) {
                $("#trNotes").show();
            } else {
                $("#trNotes").hide();
                $("#txtNotes").val("");
            }
            if (!isInitialLoad && hasFormChangedFromDefault()) {
                $("#btnLSEditApproval").show();
                $("#trNotes").show();
            }


        }


        function loadFreshWeekStockHints(productID) {
            var depotID = localStorage.getItem("DepotID");
            if (!depotID || !productID) return;

            // Strip HTML tags and text after </br>
            function normalizeProductID(str) {
                if (!str) return "";
                var cleaned = str.split("</br>")[0];  // take only before </br>
                return cleaned.trim();                 // remove leading/trailing spaces
            }

            // Convert week number to 4-digit string (add leading 0 if needed)
            function formatWeekNo(weekNo) {
                if (!weekNo) return "";
                weekNo = weekNo.toString();
                if (weekNo.length === 3) return "0" + weekNo;
                if (weekNo.length === 2) return "00" + weekNo;
                if (weekNo.length === 1) return "000" + weekNo;
                return weekNo;
            }

            // Step 1: Get ClosingStockID for the product from depot
            $.ajax({
                url: "/api/GodownStockView?DepotID=" + depotID,
                type: "GET",
                dataType: "json",
                success: function (stockList) {
                    // Only Fresh products (ignore leading/trailing spaces)
                    var freshStockList = stockList.filter(p => p.ProductGroup.trim() === "Fresh");

                    // Find the product matching the LS ProductID
                    var productStock = freshStockList.find(p => normalizeProductID(p.ProductID) === productID);

                    if (!productStock) return;

                    var closingStockID = productStock.ClosingStockID;
                    if (!closingStockID) return;

                    // Step 2: Get week-wise stock for this ClosingStockID
                    $.ajax({
                        url: "/api/GodownStockView/FreshWeekStock?ClosingStockID=" + closingStockID,
                        type: "GET",
                        dataType: "json",
                        success: function (weekStock) {
                            // Sort by oldest first (ascending WeekNo)
                            weekStock.sort((a, b) => a.WeekNo - b.WeekNo);

                            // Take max 3 weeks
                            var hints = weekStock.slice(0, 3);

                            // Show hints right of WeekNo inputs
                            $("#weekno1-check").text(hints[0] ? formatWeekNo(hints[0].WeekNo) : "");
                            $("#quantity1-check").text(hints[0] ? hints[0].QtyInBags : "");

                            $("#weekno2-check").text(hints[1] ? formatWeekNo(hints[1].WeekNo) : "");
                            $("#quantity2-check").text(hints[1] ? hints[1].QtyInBags : "");

                            $("#weekno3-check").text(hints[2] ? formatWeekNo(hints[2].WeekNo) : "");
                            $("#quantity3-check").text(hints[2] ? hints[2].QtyInBags : "");
                        }
                    });
                }
            });
        }
        function captureDefaultSnapshot() {
            defaultFormSnapshot = {};

            $("input, textarea").each(function () {
                if (this.id) {
                    defaultFormSnapshot[this.id] = $(this).val();
                }
            });

            // Handling Type
            defaultFormSnapshot["HandlingType"] =
                $("input[name=rdHandlingType]:checked").val() || "";
            defaultFormSnapshot["DA_TEXT"] = $("#dvDA").html() || "";
        }

        function hasFormChangedFromDefault() {
            var changed = false;

            // Check inputs & textarea
            $("input, textarea").each(function () {
                if (!this.id) return;

                if ((defaultFormSnapshot[this.id] || "") !== ($(this).val() || "")) {
                    changed = true;
                    return false;
                }
            });

            // Handling Type
            var currentHandlingType =
                $("input[name=rdHandlingType]:checked").val() || "";

            if (defaultFormSnapshot["HandlingType"] !== currentHandlingType) {
                changed = true;
            }

            // DA change detection
            var currentDA = $("#dvDA").html() || "";
            if ((defaultFormSnapshot["DA_TEXT"] || "") !== currentDA) {
                changed = true;
            }

            return changed;
        }

        $(document).on("change keyup", "input, textarea", function () {

            if (isInitialLoad) return;

            if (hasFormChangedFromDefault()) {
                $("#btnLSEditApproval").show();
                $("#trNotes").show();

                $("#btnSubmit").hide();
                $("#btnRefreshLsEditApproval").hide();
            } else {
                $("#btnLSEditApproval").hide();
                $("#trNotes").hide();
            }
        });
        function lockLSApprovalUI() {

            // Disable text inputs & textarea
            $("input, textarea").prop("disabled", true);

            // Disable radio buttons
            $("input[name=rdHandlingType]").prop("disabled", true);

            // Disable Kendo NumericTextBox
            $(".k-numerictextbox").each(function () {
                var numeric = $(this).data("kendoNumericTextBox");
                if (numeric) numeric.enable(false);
            });

            // Hide Approval button
            $("#btnLSEditApproval").hide();

            // Show Refresh button
            $("#btnRefreshLsEditApproval").show();
        }
        function checkLSHandlingApprovalStatus() {

            var LSID = $("#hdnLSID").val();
            if (!LSID) return;

            $.ajax({
                url: "/api/LoadingSlip/CheckLSHandlingApprovalStatus?LSID=" + LSID,
                type: "GET",
                success: function (response) {

                    if (response.isApproved) {
                        $("#btnSubmit").show();
                        $("#btnRefreshLsEditApproval").hide();
                    } else {
                        alert("Task approval is still pending.");
                    }
                },
                error: function (xhr) {
                    console.error(xhr.responseText);
                    alert("Unable to check approval status.");
                }
            });
        } function goBackToOpener() {
            window.location.href = getOpenerPage();
        }

        function getOpenerPage() {
            const params = new URLSearchParams(window.location.search);
            return params.get("from") || "LoadingSlip.html";
        }


    </script>
