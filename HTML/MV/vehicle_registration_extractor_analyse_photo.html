<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Registration Extractor</title>
    <script src="https://code.jquery.com/jquery-3.6.1.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
        }

        h2 {
            font-size: 24px;
            color: #333;
            margin-bottom: 20px;
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 80%;
            max-width: 800px;
            margin: 0 auto;
            flex-direction: column;
        }

        .camera-container {
            text-align: center;
            margin-bottom: 20px;
        }

        #openCameraButton {
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            width: 200px;
        }

            #openCameraButton:focus {
                outline: none;
            }

        .image-container {
            display: flex;
            justify-content: center;
            align-items: center;
            max-width: 99%;
            margin-top: 10px;
            border: 2px solid #ddd;
            padding: 5px;
            border-radius: 8px;
            background-color: #fff;
        }

        #preview {
            max-width: 100%;
            min-width:300px;
            max-height: 380px;
            border-radius: 8px;
            margin-top: 1px;
        }

        #result {
            margin-top: 10px;
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>
    <center> <h3> Upload Vehicle Image to Provide the probability that the photo was taken in person or from a screen/print, </h3></center>
    <div class="container">
        <div class="camera-container">
            <button id="openCameraButton">Open Camera</button>
        </div>
        <div class="image-container">
            <img id="preview" src="" alt="Captured Image">
        </div>
        <p id="result"></p>
    </div>

    <script>
        document.getElementById("openCameraButton").addEventListener("click", function () {
            const fileInput = document.createElement("input");
            fileInput.type = "file";
            fileInput.accept = "image/*";
            fileInput.capture = "environment";

            fileInput.addEventListener("change", function (event) {
                const file = event.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function (e) {
                        const base64DataUrl = e.target.result;
                        const preview = document.getElementById("preview");
                        preview.src = base64DataUrl;
                        uploadImage(base64DataUrl);
                    };
                    reader.readAsDataURL(file);
                }
            });

            fileInput.click();
        });

        async function uploadImage(imageData = null) {
            if (!imageData) {
                alert("Please capture an image first.");
                return;
            }

            const formData = new FormData();
            const blob = await fetch(imageData).then(r => r.blob());
            formData.append("image", blob, "captured_image.jpg");

            try {
                document.getElementById("result").innerText = "Processing...";

                const response = await fetch("/api/VehicleImageAnalyse/Upload", {
                    method: "POST",
                    body: formData
                });

                const data = await response.json();
                document.getElementById("result").innerText = " " + data.analysis_result;
            } catch (error) {
                console.error("Error:", error);
                document.getElementById("result").innerText = "Error extracting registration number.";
            }
        }
    </script>
</body>
</html>
