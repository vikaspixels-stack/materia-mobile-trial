<!DOCTYPE html>
<html>
<head>
    <title>Materia Mobile</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <!-- Bootstrap CSS from CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Kendo UI Styles (needed for Kendo DropDown) -->
    <link href="https://v24.vaidworld.com/Kendo/default-main.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://unpkg.com/@@progress/kendo-font-icons/dist/index.css" />

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>

    <!-- Kendo Scripts -->
    <script src="https://v24.vaidworld.com/Kendo/kendo.all.min.js"></script>
    <script src="https://v24.vaidworld.com/Kendo/telerik-license.js"></script>

    <link href="css/materia.css?v=1.28" rel="stylesheet" />
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#7952b3">

</head>
<body class="bg-gray">
    <div class="container-fluid">
        <header id="header">
            <script src="Scripts/header.js?v=1.06" defer></script>
        </header>
        <main>
            <div class="bg-warning" id="dvWarning" style="padding:5px;min-height:80px;display:none">
                <div id="dvMessage" style="display:none"></div>
            </div>

            <div class="container" style="margin-top: 20px;padding-top:10px;width: 100% !important; background-color: white !important; ">

                <div class="form-group">
                    <div style="background-color:#fff !important; border: solid 3px #E0E0E0;padding:5px">
                        <p><strong>Status:</strong> <span id="spnType"></span></p>
                        <p><strong>Plant Truck No:</strong> <span id="spnTruckNo"></span></p>
                        <p><strong>Driver :</strong> <span id="spnDriver"></span></p>
                        <p><strong>Transporter:</strong> <span id="spnTransporter"></span></p>
                        <p><strong>Product:</strong> <span id="spnProduct"></span></p>
                        <p>
                            <strong>DA:</strong> <span id="spnDANumber"></span> &nbsp;&nbsp;
                            <strong>Bal. MT:</strong> <span id="spnBalMT"></span>&nbsp;&nbsp;
                            <strong>Bags :</strong> <span id="spnBags"></span>
                        </p>
                        <p><strong>Week No. :</strong> <span id="spnWeekNumber"></span></p>
                        <p><strong>Truck In Time:</strong> <span id="spnTruckInTime"></span></p>
                        <p><strong>Last GRN Date:</strong> <span id="spnLastGRNDate"></span></p>
                    </div>

                    <div>
                        <table border="0" cellpadding="2" cellspacing="2" width="100%">
                            <tr style="display:none">
                                <td style="white-space: nowrap;"><strong>Is Damaged (TL01)</strong></td>
                                <td>:</td>
                                <td style="padding-left: 0;">
                                    <label style="display: inline-flex; align-items: center; gap: 5px; font-weight: normal;">
                                        <input type="checkbox" id="chkIsDamaged" value="Yes" style="margin: 0;" />
                                    </label>
                                </td>
                                <td>
                                    <table>
                                        <tr>
                                            <td style="white-space: nowrap;"><strong>Is LIST (LT01)</strong></td>
                                            <td>:</td>
                                            <td style="padding-left: 0;">
                                                <label style="display: inline-flex; align-items: center; gap: 5px; font-weight: normal;">
                                                    <input type="checkbox" id="chkIsLIST" value="Yes" style="margin: 0;" />
                                                </label>
                                            </td>
                                        </tr>
                                    </table>
                                </td>
                            </tr>
                            <tr>
                                <td><strong>Unloaded Qty. (Bags)</strong></td>
                                <td>:</td>
                                <td colspan="2"> 
                                    <input type="number" class="form-control" id="txtUnloadedBags" min="0" />
                                </td>
                            </tr>
                            <tr>
                                <td valign="top"><strong>Notes</strong></td>
                                <td valign="top">:</td>
                                <td style="width:80%" colspan="2">
                                    <textarea id="txtNotes" class="form-control" rows="4" style="padding:13px;height:96%;width:100%"></textarea>
                                </td>
                            </tr>
                        </table>
                    </div>

                    <div class="button-group" style="display: flex; justify-content: center;padding:10px">
                        <button class="button submit" id="btnSubmit" onclick="fnSubmit()">SUBMIT</button>
                        <button class="btn btn-secondary ms-3" onclick="window.history.back();">CANCEL</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <footer id="footer">
        <script src="Scripts/footer3.js?v1.25" defer></script>
        <script src="Scripts/depotselection2.js?v6"></script>
    </footer>

    <script>
        $(document).ready(function () {
            fnSetPageName("Unloading");

            const today = new Date();
            const dd = String(today.getDate()).padStart(2, '0');
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            const yyyy = today.getFullYear();
            const formattedDate = `${dd}/${mm}/${yyyy}`;
            $("#txtDate").text(formattedDate);

            const grnId = getQueryParam("GRNID");
            if (grnId) {
                bindGRNDetails(grnId);
            }

            $("#ddlMissingReasons").kendoDropDownList({
                optionLabel: "Select Reason...",
                dataTextField: "MissingReason",
                dataValueField: "MTRID",
                dataSource: {
                    transport: {
                        read: {
                            url: "/api/PlantTruck/GetMissingTruckReasons",
                            dataType: "json",
                            data: function () {
                                const data = {};
                                const OriginalMissingType = getQueryParam("OriginalMissingType");
                                const MTRID = 0;
                                if (OriginalMissingType) data.OriginalMissingType = OriginalMissingType;
                                if (MTRID !== null && MTRID !== "null") data.MTRID = MTRID;
                                return data;
                            }
                        }
                    }
                }
            });
        });

        function fnSubmit() {
            const userId = getUserID();
            const depotId = getDepotID();
            const daNo = $("#spnDANumber").text().trim();
            const weekNo = $("#spnWeekNumber").text().trim();
            const notes = $("#txtNotes").val();

            const isUnloadingLIST = $("#chkIsDamaged").is(":checked");
            const IsLIST = $("#chkIsLIST").is(":checked"); // keep consistent

            if (!userId || !depotId || !daNo) {
                alert("Missing required input (UserID, DepotID, or DA No.)");
                return false;
            }

            const qtyStr = $("#txtUnloadedBags").val().trim();
            const qty = qtyStr === "" ? null : Number(qtyStr);

            if (qty === null) {
                alert("Unloaded Qty. is required.");
                return false;
            }
            if (Number.isNaN(qty)) {
                alert("Unloaded Qty. must be a number.");
                return false;
            }
            if (qty < 0) {
                alert("Unloaded Qty. cannot be negative.");
                return false;
            }

            if (isUnloadingLIST && IsLIST) {
                alert("Is Damaged (TL01) / Is LIST (LT01) — only one can be selected.");
                return false;
            }

            if (IsLIST) {
                if (!confirm("Is LIST(LT01) Continue?")) return false;
            }

            const dataToSend = {
                UserID: parseInt(userId, 10),
                DepotID: parseInt(depotId, 10),
                DANo: daNo,
                IsUnloadingLIST: isUnloadingLIST,
                IsLIST: IsLIST,
                Qty: qty,
                WeekNo: weekNo,
                Notes: notes
            };

            $.ajax({
                url: '/api/PlantTruck/SaveUnloadingSlip',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify(dataToSend),
                //success: function (response) {
                //    if (response.LSID === -1 || response.LSID === 0) {
                //        alert("Entered quantity exceeds available balance stock.");
                //        return;
                //    }

                //    alert("Unloading slip saved successfully. LSID: " + response.LSID);
                //    window.location.href = "Loadingslip.html";
                //},
                success: function (response) {

                    // response already has required fields
                     fnTriggerSAPGRNPost(response);

                    setTimeout(function () {
                        window.location.href = "Loadingslip.html";
                    }, 800);             
                },
                error: function (xhr) {
                    console.error("Error:", xhr.responseText);
                    alert("Failed to save unloading slip.");
                }
            });

            return false; // stops default form submit if button is submit
        }
        function fnTriggerSAPGRNPost(data) {

            const payload = {
                requestHeader: {
                    flowId: "SAP-GRN-POST"
                },
                parameters: {
                    deliveryNumber: data.deliveryNumber,
                    saleQuantity: data.saleQuantity,
                    depotCode: data.depotCode,                  
                    truckNumber: data.truckNumber,
                    tokenRRNumber: data.tokenRRNumber, // LSNO
                    storageLocation: data.storageLocation,
                    isGenerateTransMetadata: false
                }
            };
            //alert(JSON.stringify(payload));
            $.ajax({
                url: "/api/FlowGrn/Trigger",
                type: "POST",
                contentType: "application/json",
                data: JSON.stringify(payload),
                success: function () {
                    alert("SAP GRN Triggered Successfully!");
                },
                error: function (xhr) {
                    console.error(xhr.responseText);
                    alert("SAP GRN Trigger Failed");
                }
            });
        }




        function getQueryParam(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }

        function bindGRNDetails(grnId) {
            if (!grnId) return;

            $.ajax({
                url: '/api/PlantTruck/GetMissingTruckByGRNID?GRNID=' + grnId,
                type: "GET",
                dataType: "json",
                success: function (data) {
                    if (data) {
                        $("#spnType").text(getQueryParam("Status"));
                        $("#spnTruckNo").text(data.LorryNumber || "");
                        $("#spnTransporter").text(data.TransporterName || "");
                        $("#spnProduct").text(data.ProductID || "");
                        $("#spnDANumber").text(data.DANo || "");
                        $("#spnBalMT").text(data.QtyMT || "");
                        $("#spnLastGRNDate").text(formatDateTime(data.LastGRNDate) || "");
                        $("#spnTruckInTime").text(formatDateTime(data.TruckInTime) || "");
                        $("#spnWeekNumber").text(data.WeekNumber || "");
                        $("#spnBags").text(data.QtyMTBags || "");
                        $("#spnDriver").text((data.DriverName || '') + ' ' + (data.DriverMobileNumber || ''));
                    }
                },
                error: function (xhr) {
                    console.error("Error fetching GRN truck details:", xhr.responseText);
                }
            });
        }

        function getDepotID() {
            return localStorage.getItem("DepotID").toString();
        }

        function getUserID() {
            return localStorage.getItem("userID").toString();
        }

        function formatDateTime(dateString) {
            if (!dateString) return "";

            const date = new Date(dateString);
            if (isNaN(date)) return "";

            const dd = String(date.getDate()).padStart(2, '0');
            const mm = String(date.getMonth() + 1).padStart(2, '0');
            const yyyy = date.getFullYear();

            const hh = String(date.getHours()).padStart(2, '0');
            const min = String(date.getMinutes()).padStart(2, '0');

            return `${dd}/${mm}/${yyyy} ${hh}:${min}`;
        }
    </script>
</body>
</html>
