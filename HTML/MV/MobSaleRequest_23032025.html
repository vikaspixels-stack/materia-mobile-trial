        function _clearCombobox(e,param) {
            if (param == 'dvDealer') {
                $("#lstDealerName").data("kendoListView").clearSelection();
                $("#dvDealer").html('');
                $(e).hide();
            } else if (param == 'dvProduct1') {
                $("#lstProduct1").data("kendoListView").clearSelection();
                $("#dvProduct1").html('');
                $(e).hide();
            } else if (param == 'dvProduct2') {
                $("#lstProduct2").data("kendoListView").clearSelection();
                $("#dvProduct2").html('');
                $(e).hide();
            } else if (param == 'dvProduct3') {
                $("#lstProduct3").data("kendoListView").clearSelection();
                $("#dvProduct3").html('');
                $(e).hide();
            }
        }
    
        document.getElementById("openCameraButton").addEventListener("click", function () {
            const fileInput = document.createElement("input");
            fileInput.type = "file";
            fileInput.accept = "image/*";
            fileInput.capture = "environment";

            fileInput.addEventListener("change", function (event) {
                const file = event.target.files[0];
                if (file) {
                   
                    compressAndUpload(file);
                    vehicleImageAnalyse(file);
                    extractMetadata(file);
                    readDatetime(file);
                    $(".data-container").show();
                    $("#btnVerifyOrder").removeClass("disabled").addClass("verify").removeAttr("disabled");

                    // Enable the Submit button
                    $("#btnSubmit").removeClass("disabled").addClass("submit").removeAttr("disabled");

                }
            });

            fileInput.click();
        });

        function readImage(file) {
            const reader = new FileReader();
            reader.onload = function (event) {
                const img = document.getElementById('preview');
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }

        function extractMetadata(file) {
            const reader = new FileReader();
            reader.readAsArrayBuffer(file);
            reader.onload = function (event) {
                const exifData = EXIF.readFromBinaryFile(event.target.result);

                const latitude = exifData?.GPSLatitude ? convertToDecimal(exifData.GPSLatitude, exifData.GPSLatitudeRef).toFixed(2) : "N/A";
                const longitude = exifData?.GPSLongitude ? convertToDecimal(exifData.GPSLongitude, exifData.GPSLongitudeRef).toFixed(2) : "N/A";
                const dateTime = exifData?.DateTimeOriginal ? formatDateTime(exifData.DateTimeOriginal) : "N/A";
              //  const isRealImage = (latitude !== "N/A" && longitude !== "N/A") ? "✅ Real Image" : "❌ Fake Image (No GPS Data)";
                /*<br>📍 <b>Location:</b> ${latitude}, ${longitude}*/
              /*  `📅 <b>Date/Time:</b> ${dateTime}<br>*/
                document.getElementById("metadata").innerHTML =
                    `📅 <b>Date/Time:</b> <span id="image_datetime"></span>    <br>
                     <b>🌍 Dist. from Depot:</b> <span id="distance_from_depot"></span>                    
                    <br>📝 <b>Image Authenticity:</b> <span id="image_authenticity"></span>`;   

                if (latitude !== "N/A" && longitude !== "N/A") {
                    calculateDistance(latitude, longitude);
                }
            };
        }

        function convertToDecimal(coord, ref) {
            const decimal = coord[0] + (coord[1] / 60) + (coord[2] / 3600);
            return (ref === "S" || ref === "W") ? -decimal : decimal;
        }

        function calculateDistance(lat1, lon1) {
            const R = 6371000;
            const lat1Rad = lat1 * Math.PI / 180;
            const lon1Rad = lon1 * Math.PI / 180;
            const lat2Rad = BASE_LAT * Math.PI / 180;
            const lon2Rad = BASE_LON * Math.PI / 180;

            const dLat = lat2Rad - lat1Rad;
            const dLon = lon2Rad - lon1Rad;

            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1Rad) * Math.cos(lat2Rad) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);

            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            const distance = (R * c)/1000;

            document.getElementById("distance_from_depot").innerText = `${distance.toFixed(2)} km.`;
        }

      

        async function compressAndUpload(file) {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = function (event) {
                const img = new Image();
                img.src = event.target.result;
                img.onload = function () {
                    const canvas = document.createElement("canvas");
                    const ctx = canvas.getContext("2d");
                    canvas.width = 400;
                    canvas.height = 400;
                    ctx.drawImage(img, 0, 0, 400, 400);

                    canvas.toBlob(async function (blob) {
                        document.getElementById("preview").src = URL.createObjectURL(blob);
                        const formData = new FormData();
                        formData.append("image", blob, "compressed_image.jpg");

                        try {
                            document.getElementById("registration_number").innerText = "Processing...";
                            const response = await fetch("/api/VehicleNumberExtractor/license-plate", {
                                method: "POST",
                                body: formData
                            });
                            const data = await response.json();
                            document.getElementById("registration_number").innerText = " " + data.registration_number;
                        } catch (error) {
                            console.error("Error:", error);
                            document.getElementById("registration_number").innerText = "Error extracting registration number.";
                        }
                    }, "image/jpeg", 1.0);
                };
            };
        }

        async function vehicleImageAnalyse(file) {
            var formData = new FormData();
            formData.append('image', file);

            $.ajax({
                url: '/api/VehicleImageAnalyse/upload',
                type: 'POST',
                data: formData,
                processData: false,
                contentType: false,
                success: function (response) {
                    console.log('API Response:', response);
                    $("#image_authenticity").html(response.analysis_result);
                    //alert('Analysis Result: ' + response.analysis_result);
                },
                error: function (xhr, status, error) {
                    console.error('Error:', xhr.responseText);
                    alert('Error uploading image: ' + xhr.responseText);
                }
            });
        }
        async function readDatetime(file) {
            var formData = new FormData();
            formData.append('image', file);

            $.ajax({
                url: '/api/VehicleNumberExtractor/datetime',
                type: 'POST',

                   // console.log(response);
                    //alert('Analysis Result: ' + response.analysis_result);
                },
                error: function (xhr, status, error) {
                    console.error('Error:', xhr.responseText);
                    alert('Error uploading image: ' + xhr.responseText);
                }

        }


        function formatDateTime(dateTime) {
            const [date, time] = dateTime.split(' ');
            const [year, month, day] = date.split(':');
            const [hours, minutes] = time.split(':');

            return `${day}/${month}/${year} ${hours}:${minutes}`;
        }

            $("#spPageName").html("Sale Request");
        }
