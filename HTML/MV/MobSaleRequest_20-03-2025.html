    <script type="text/kendo-x-tmpl" id="tmpDealer">
        <div style="border-bottom: 1px solid lightgrey;padding:5px;">

    <script type="text/kendo-x-tmpl" id="tmpProduct">
        <div style="border-bottom: 1px solid lightgrey;padding:5px;">
            <div style="display:table-cell;padding: 5px 10px;width:140px;">#: data.ProductID #</div>
            <div style="display:table-cell;padding: 5px 10px;">#: data.ProductDesc #</div>
        </div>

    <script>
        
        $(document).ready(function () {




            $("#dvDealerName").kendoTouch({
                tap: function (e) {
                    $("#kwDealerName").data("kendoWindow").open();
                }
            });

            $("#dvProductTouch1").kendoTouch({
                tap: function (e) {
                    DealerData = undefined
                    $("#kwProduct1").data("kendoWindow").open();
                }
            });

            $("#dvProductTouch2").kendoTouch({
                tap: function (e) {
                    DealerData = undefined
                    $("#kwProduct2").data("kendoWindow").open();
                }
            });

            $("#dvProductTouch3").kendoTouch({
                tap: function (e) {
                    DealerData = undefined
                    $("#kwProduct3").data("kendoWindow").open();
                }
            });

            $("#lstDealerName").kendoListView({
                dataSource: {
                    transport: {
                        read: {
                            url: '../api/Mob_RetrieveDealersFromDepotCustomerMap?GodownID=40',
                            dataType: "json"
                        }
                    }, sort: { field: "Customer", dir: "asc" }
                },
                template: kendo.template($("#tmpDealer").html()),
                selectable: "single",
                change: function (e) {
                    // get ListView selection
                    var selectedItems = e.sender.select();
                    var dataItem = $("#lstDealerName").data("kendoListView").dataItem(selectedItems);
                    $(".clsbtnDealer").show();
                    $('#dvDealer').html(dataItem.SoldToParty);
                    $("#kwDealerName").data("kendoWindow").close();
                }
            });

            $("#lstProduct1").kendoListView({
                dataSource: {
                    transport: {
                        read: {
                            url: '../api/DealerMob',
                            dataType: "json"
                        }
                    }, sort: { field: "ProductID", dir: "asc" }
                },
                template: kendo.template($("#tmpProduct").html()),
                selectable: "single",
                change: function (e) {
                    // get ListView selection
                    var selectedItems = e.sender.select();
                    var dataItem = $("#lstProduct1").data("kendoListView").dataItem(selectedItems);
                    $(".clsbtnProduct1").show();
                    $('#dvProduct1').html(dataItem.ProductIDwithDesc);
                    $("#kwProduct1").data("kendoWindow").close();
                }
            });

            $("#lstProduct2").kendoListView({
                dataSource: {
                    transport: {
                        read: {
                            url: '../api/DealerMob',
                            dataType: "json"
                        }
                    }, sort: { field: "ProductID", dir: "asc" }
                },
                template: kendo.template($("#tmpProduct").html()),
                selectable: "single",
                change: function (e) {
                    // get ListView selection
                    var selectedItems = e.sender.select();
                    var dataItem = $("#lstProduct2").data("kendoListView").dataItem(selectedItems);
                    $(".clsbtnProduct2").show();
                    $('#dvProduct2').html(dataItem.ProductIDwithDesc);
                    $("#kwProduct2").data("kendoWindow").close();
                }
            });

            $("#lstProduct3").kendoListView({
                dataSource: {
                    transport: {
                        read: {
                            url: '../api/DealerMob',
                            dataType: "json"
                        }
                    }, sort: { field: "ProductID", dir: "asc" }
                },
                template: kendo.template($("#tmpProduct").html()),
                selectable: "single",
                change: function (e) {
                    // get ListView selection
                    var selectedItems = e.sender.select();
                    var dataItem = $("#lstProduct3").data("kendoListView").dataItem(selectedItems);
                    $(".clsbtnProduct3").show();
                    $('#dvProduct3').html(dataItem.ProductIDwithDesc);
                    $("#kwProduct3").data("kendoWindow").close();
                }
            });

            $("#kwDealerName").kendoWindow({
                width: "90vw",
                height: "90vh",
                //title: "About Alvar Aalto",
                visible: false,
                modal: true
            }).data("kendoWindow").center();
            $("#kwDealerName").attr("style", "padding:0px!important;");
            $("#kwDealerName").closest("div.k-window").find("div.k-window-titlebar").find("span.k-window-title").html("");

            $("#kwProduct1").kendoWindow({
                width: "90vw",
                height: "90vh",
                //title: "About Alvar Aalto",
                visible: false,
                modal: true
            }).data("kendoWindow").center();
            $("#kwProduct1").attr("style", "padding:0px!important;");
            $("#kwProduct1").closest("div.k-window").find("div.k-window-titlebar").find("span.k-window-title").html("");

            $("#kwProduct2").kendoWindow({
                width: "90vw",
                height: "90vh",
                visible: false,
                modal: true
            }).data("kendoWindow").center();
            $("#kwProduct2").attr("style", "padding:0px!important;");
            $("#kwProduct2").closest("div.k-window").find("div.k-window-titlebar").find("span.k-window-title").html("");

            $("#kwProduct3").kendoWindow({
                width: "90vw",
                height: "90vh",
                visible: false,
                modal: true
            }).data("kendoWindow").center();
            $("#kwProduct3").attr("style", "padding:0px!important;");
            $("#kwProduct3").closest("div.k-window").find("div.k-window-titlebar").find("span.k-window-title").html("");

        function _clearCombobox(e,param) {
            if (param == 'dvDealer') {
                $("#lstDealerName").data("kendoListView").clearSelection();
                $("#dvDealer").html('');
                $(e).hide();
            } else if (param == 'dvProduct1') {
                $("#lstProduct1").data("kendoListView").clearSelection();
                $("#dvProduct1").html('');
                $(e).hide();
            } else if (param == 'dvProduct2') {
                $("#lstProduct2").data("kendoListView").clearSelection();
                $("#dvProduct2").html('');
                $(e).hide();
            } else if (param == 'dvProduct3') {
                $("#lstProduct3").data("kendoListView").clearSelection();
                $("#dvProduct3").html('');
                $(e).hide();
            }
        }
    
        document.getElementById("openCameraButton").addEventListener("click", function () {
            const fileInput = document.createElement("input");
            fileInput.type = "file";
            fileInput.accept = "image/*";
            fileInput.capture = "environment";

            fileInput.addEventListener("change", function (event) {
                const file = event.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function (e) {
                        const base64DataUrl = e.target.result;
                        const preview = document.getElementById("preview");
                        preview.src = base64DataUrl;
                        uploadImage(base64DataUrl);
                    };
                    reader.readAsDataURL(file);
                }
            });

            fileInput.click();
        });

        async function uploadImage(imageData = null) {
            if (!imageData) {
                alert("Please capture an image first.");
                return;
            }

            const formData = new FormData();
            const blob = await fetch(imageData).then(r => r.blob());
            formData.append("image", blob, "captured_image.jpg");

            try {
                document.getElementById("result").innerText = "Processing...";

                const response = await fetch("/api/extract3/license-plate", {
                    method: "POST",
                    body: formData
                });

                const data = await response.json();
                //document.getElementById("result").innerText = " " + data.registration_number;
                // Update HTML with extracted data
                $("#registration_number").text(data.registration_number || "N/A");
                //$("#gps_latitude").text(data.gps_latitude !== null ? data.gps_latitude : "N/A");
                //$("#gps_longitude").text(data.gps_longitude !== null ? data.gps_longitude : "N/A");
                const distance = calculateDistance(data.depotLatitude, data.depotLongitude, data.gps_latitude, data.gps_longitude);
                $("#distance_from_depot_km").text(distance);
                $("#image_date_time").text(data.extraction_timestamp || "N/A");

                document.getElementById("result").innerText = "";

                document.getElementById("dvResult").style.display = "block";
                //await waitForGPSData();
                //getLocationName();
            } catch (error) {
                console.error("Error:", error);
                document.getElementById("result").innerText = "Error extracting registration number.";
            }
        }
        function calculateDistance(depotLat, depotLon, lat, lon) {
            const earthRadiusKm = 6371.0; // Radius of the Earth in KM

            const dLat = degreesToRadians(lat - depotLat);
            const dLon = degreesToRadians(lon - depotLon);

            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(degreesToRadians(depotLat)) * Math.cos(degreesToRadians(lat)) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);

            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));

            return (earthRadiusKm * c).toFixed(2); // Returns distance in KM rounded to 2 decimal places
        }

        // Function to convert degrees to radians
        function degreesToRadians(degrees) {
            return degrees * (Math.PI / 180);
        }

        function fnSubmit() {
            window.location.href = "MobSaleRequestDetails.html";
        }
    </script>
