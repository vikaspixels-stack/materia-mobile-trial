        <div class="row">
            <div class="col-sm-6">
                <div class="camera-container">
                    <button id="openCameraButton">Open Camera</button>
                </div>
            </div>
            <div class="col-sm-6">
                <div class="image-container">
                    <img id="preview" src="" alt="Captured Image">
                </div>
                <p id="result"></p>
            </div>
        </div>

        <script>
            document.getElementById("openCameraButton").addEventListener("click", function () {
                const fileInput = document.createElement("input");
                fileInput.type = "file";
                fileInput.accept = "image/*";
                fileInput.capture = "environment";

                fileInput.addEventListener("change", function (event) {
                    const file = event.target.files[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = function (e) {
                            const base64DataUrl = e.target.result;
                            const preview = document.getElementById("preview");
                            preview.src = base64DataUrl;
                            uploadImage(base64DataUrl);
                        };
                        reader.readAsDataURL(file);
                    }
                });

                fileInput.click();
            });

            async function uploadImage(imageData = null) {
                if (!imageData) {
                    alert("Please capture an image first.");
                    return;
                }

                const formData = new FormData();
                const blob = await fetch(imageData).then(r => r.blob());
                formData.append("image", blob, "captured_image.jpg");

                try {
                    document.getElementById("result").innerText = "Processing...";

                    const response = await fetch("/api/extract/license-plate", {
                        method: "POST",
                        body: formData
                    });

                    const data = await response.json();
                    document.getElementById("result").innerText = " " + data.registration_number;
                } catch (error) {
                    console.error("Error:", error);
                    document.getElementById("result").innerText = "Error extracting registration number.";
                }
            }
        </script>
