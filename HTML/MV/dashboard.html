<html lang="en">
<head>
    <title>Materia Mobile</title>

    <!-- Bootstrap JS from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        /* Page slider wrapper */
        #dashboard-pages-wrapper {
            overflow: hidden;
            width: 100%;
            position: relative;
        }

        #dashboard-pages {
            display: flex;
            width: 200%;
            transition: transform 0.35s ease;
        }

        .dashboard-page {
            width: 50%;
            flex-shrink: 0;
        }

        /* Page indicator dots */
        .page-indicator {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            padding: 6px 0 2px 0;
        }

        .page-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ccc;
            transition: background 0.2s;
        }

            .page-dot.active {
                background: #7952b3;
            }

        /* Navigation arrow */
        .page-nav-row {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 2px 8px 0 8px;
        }

            .page-nav-row.left {
                justify-content: flex-start;
            }

        .nav-arrow {
            background: none;
            border: none;
            font-size: 22px;
            color: #7952b3;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 50%;
            transition: background 0.15s;
        }

            .nav-arrow:active {
                background: rgba(121, 82, 179, 0.12);
            }
    </style>

</head>
<body>

    <div class="container-fluid">
        <div id="header">
            <script src="Scripts/header.js?v=1.3"></script>
        </div>


        <div class="bg-warning" style="padding:3px;min-height:80px;display:block">
            <!--Important Notification: System maintenance scheduled for 2 AM to 4 AM.-->
        </div>
        <div class="container-fluid-inner">

            <!-- Page indicator + nav arrows -->
            <div style="display:flex; justify-content:space-between; align-items:center; padding: 0 4px;">
                <button class="nav-arrow" id="btnPrevPage" onclick="goToPage(0)" style="visibility:hidden;">
                    <i class="fas fa-chevron-left"></i>
                </button>
                <div class="page-indicator" style="padding: 2px 0;">
                    <div class="page-dot active" id="dot0"></div>
                    <div class="page-dot" id="dot1"></div>
                </div>
                <button class="nav-arrow" id="btnNextPage" onclick="goToPage(1)">
                    <i class="fas fa-chevron-right"></i>
                </button>
            </div>

            <!-- Swipeable pages wrapper -->
            <div id="dashboard-pages-wrapper">
                <div id="dashboard-pages">

                    <!-- ===== PAGE 1 ===== -->
                    <div class="dashboard-page">

                        <div class="row py-0" style="display: flex; gap: 5px;">
                            <div class="col" onclick="fnSalesRequest()" style="cursor: pointer; text-align: center; padding: 5px;">
                                <div class="box">
                                    <i class="fa-solid fa-file-invoice" style="font-size: 30px;"></i>
                                    <div class="box-text">Sales Request</div>
                                </div>
                            </div>

                            <div class="col" onclick="fnNonInvoicedLS()" style="cursor: pointer; text-align: center; padding: 5px;">
                                <div class="box">
                                    <i class="fa-solid fa-truck-fast" style="font-size: 30px;"></i>
                                    <div class="box-text">Loading Slip</div>
                                </div>
                            </div>
                            <div class="col" onclick="fnSalesInvoice()" style="cursor: pointer; text-align: center; padding: 5px;">
                                <div class="box">
                                    <i class="fas fa-print" style="font-size: 30px;"></i>
                                    <div class="box-text">Print Sales Invoice</div>
                                </div>
                            </div>
                        </div>

                        <div class="row py-0" style="display: flex; gap: 5px;">
                            <div class="col" onclick="fnPendingOrder()" style="cursor: pointer; text-align: center; padding: 5px;">
                                <div class="box">
                                    <i class="fas fa-box" style="font-size: 30px;"></i>
                                    <div class="box-text">Pending Orders</div>
                                </div>
                            </div>

                            <div class="col" onclick="fnSITTrucks()" style="text-align: center; padding: 5px;">
                                <div class="box">
                                    <i class="fas fa-truck-moving" style="font-size: 30px;"></i>
                                    <div class="box-text">SIT Trucks</div>
                                </div>
                            </div>
                            <div class="col" onclick="fnHaltedTrucks()" style="text-align: center; padding: 5px;">
                                <div class="box">
                                    <i class="fas fa-truck" style="font-size: 30px;"></i>
                                    <div class="box-text">Halted Trucks</div>
                                </div>
                            </div>
                        </div>

                        <!-- Row 3: Depot Stock | Damages | Shortages -->
                        <div class="row py-0" style="display: flex; gap: 5px;">
                            <div class="col" onclick="fnGodownStockView()" style="text-align: center; padding: 5px;">
                                <div class="box">
                                    <i class="fas fa-warehouse" style="font-size: 30px;"></i>
                                    <div class="box-text">Depot Stock</div>
                                </div>
                            </div>

                            <div class="col" onclick="fnDamages()" style="cursor: pointer; text-align: center; padding: 5px;">
                                <div class="box">
                                    <i class="fas fa-box-open" style="font-size: 30px;"></i>
                                    <div class="box-text">Damages</div>
                                </div>
                            </div>

                            <!-- NEW: Shortages tile -->
                            <div class="col" onclick="fnShortages()" style="cursor: pointer; text-align: center; padding: 5px;">
                                <div class="box">
                                    <i class="fas fa-exclamation-triangle" style="font-size: 30px;"></i>
                                    <div class="box-text">Shortages</div>
                                </div>
                            </div>
                        </div>

                        <!-- Row 4: Print POD | Logout | (empty) -->
                        <div class="row py-0" style="display: flex; gap: 5px;">
                            <div class="col" onclick="fnContact()" style="text-align: center; padding: 5px;">
                                <div class="box disabled">
                                    <i class="fas fa-print" style="font-size: 30px;"></i>
                                    <div class="box-text">Print POD</div>
                                </div>
                            </div>

                            <div class="col" onclick="fnLogout()" style="cursor: pointer; text-align: center; padding: 5px;">
                                <div class="box">
                                    <i class="fas fa-sign-out-alt" style="font-size: 30px;"></i>
                                    <div class="box-text">Logout</div>
                                </div>
                            </div>

                            <div class="col" style="text-align: center; padding: 5px;">
                                <div class="box" style="visibility: hidden;"></div>
                            </div>
                        </div>

                    </div>
                    <!-- ===== END PAGE 1 ===== -->
                    <!-- ===== PAGE 2 ===== -->
                    <div class="dashboard-page">

                        <div class="row py-0" style="display: flex; gap: 5px;">
                            <div class="col" style="text-align: center; padding: 5px;">
                                <div class="box disabled">
                                    <i class="fas fa-user-check" style="font-size: 30px;"></i>
                                    <div class="box-text">Attendance</div>
                                </div>
                            </div>
                            <div class="col" style="text-align: center; padding: 5px;">
                                <div class="box disabled">
                                    <i class="fas fa-cogs" style="font-size: 30px;"></i>
                                    <div class="box-text">Settings</div>
                                </div>
                            </div>
                            <div class="col" style="padding: 5px; visibility: hidden;">
                                <div class="box disabled"></div>
                            </div>
                        </div>

                        <!-- Admin-only documentation row -->
                        <div class="row py-0" id="adminDocsRow" style="display: none; gap: 5px;">
                            <div class="col" onclick="fnTechnicalDoc()" style="cursor: pointer; text-align: center; padding: 5px;">
                                <div class="box">
                                    <i class="fas fa-file-code" style="font-size: 30px;"></i>
                                    <div class="box-text">Technical Docs</div>

                            <div class="col" onclick="fnUserManual()" style="cursor: pointer; text-align: center; padding: 5px;">

                                    <i class="fas fa-book-open" style="font-size: 30px;"></i>

                                </div>
                            </div>
                            <div class="col" style="padding: 5px; visibility: hidden;">

                            </div>
                        </div>

                    </div>
                    <!-- ===== END PAGE 2 ===== -->

            </div>
            <!-- End swipeable pages wrapper -->

        </div>

    </div>
    <script v="1.2123">
        // Admin role ID — adjust this value to match your actual admin RoleID
        var ADMIN_ROLE_ID = 1;

        function checkAdminAccess() {
            var roleID = parseInt(localStorage.getItem("roleID") || "0", 10);
            if (roleID === ADMIN_ROLE_ID) {
                document.getElementById("adminDocsRow").style.display = "flex";
            }
        }

        function fnTechnicalDoc() {
            window.open("https://docs.google.com/document/d/1FdNsVfdV6P_ucTtQNhdxTCDMGNu0RE96/edit?usp=sharing&ouid=114234086626014789518&rtpof=true&sd=true", "_blank");
        }

        function fnUserManual() {
            window.open("https://docs.google.com/document/d/1MFz3e2zdyZXGLw4EL1Oag1TWtMxBhfbD/edit?usp=drive_link&ouid=114234086626014789518&rtpof=true&sd=true", "_blank");
        }

        // Call inside your existing $(document).ready
        $(document).ready(function () {
            fnSetPageName("Home");
            checkAdminAccess();   // <-- add this line
        });
    (function validateTokenOnLoad() {
            const token = localStorage.getItem("authToken");

            function isTokenExpired(token) {
                if (!token) return true;
                try {
                    const payloadBase64 = token.split('.')[1];
                    const decodedJson = atob(payloadBase64);
                    const decoded = JSON.parse(decodedJson);
                    const exp = decoded.exp;
                    const currentTime = Math.floor(Date.now() / 1000);
                    return exp < currentTime;
                } catch (e) {
                    console.error("Invalid token format", e);
                    return true;
                }
            }

            if (!token || isTokenExpired(token)) {
                localStorage.removeItem("authToken");
                localStorage.removeItem("userID");
                localStorage.removeItem("DepotID");
                localStorage.removeItem("DepotName");
                window.location.href = "login.html";
            }
        })();

        function fnGodownStockView() {
            window.location.href = "GodownStockView.html?DepotID=" + localStorage.getItem("DepotID");
        }

        function fnSalesRequest() {
            window.location.href = "MobSaleRequestNew2.html";
        }

        function fnSalesInvoice() {
            window.location.href = "SaleInvoice.html?TranDate=2025-03-23&DepotID=" + localStorage.getItem("DepotID");
        }

        function fnPendingOrder() {
            window.location.href = "PendingOrder2.html?DepotID=" + localStorage.getItem("DepotID");
        }

        function fnSITTrucks() {
            window.location.href = "SITTrucks.html";
        }

        function fnHaltedTrucks() {
            window.location.href = "HaltedTruck.html";
        }

        function fnNonInvoicedLS() {
            window.location.href = "Loadingslip2.html?DepotID=" + localStorage.getItem("DepotID");
        }

        function fnDamages() {
            window.location.href = "DamageGrid.html?DepotID=" + localStorage.getItem("DepotID");
        }

        function fnShortages() {
            window.location.href = "ArrivalShortage.html?DepotID=" + localStorage.getItem("DepotID");
        }

        function fnLogout() {
            localStorage.removeItem("authToken");
            localStorage.removeItem("userID");
            localStorage.removeItem("DepotID");
            localStorage.removeItem("DepotName");
            localStorage.removeItem("DepotLongitude");
            localStorage.removeItem("DepotLatitude");
            window.location.href = "login.html";
        }

        $(document).ready(function () {
            fnSetPageName("Home");
        });

        // ── Page sliding logic ──────────────────────────────────────────
        var currentPage = 0;

        function goToPage(page) {
            currentPage = page;
            var pct = page * -50; // each page is 50% of the 200%-wide strip
            document.getElementById('dashboard-pages').style.transform = 'translateX(' + pct + '%)';

            // Update dots
            document.getElementById('dot0').classList.toggle('active', page === 0);
            document.getElementById('dot1').classList.toggle('active', page === 1);

            // Update arrow visibility
            document.getElementById('btnPrevPage').style.visibility = page === 0 ? 'hidden' : 'visible';
            document.getElementById('btnNextPage').style.visibility = page === 1 ? 'hidden' : 'visible';
        }

        // Touch / swipe support
        (function () {
            var wrapper = document.getElementById('dashboard-pages-wrapper');
            var startX = 0;
            var startY = 0;

            wrapper.addEventListener('touchstart', function (e) {
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
            }, { passive: true });

            wrapper.addEventListener('touchend', function (e) {
                var dx = e.changedTouches[0].clientX - startX;
                var dy = e.changedTouches[0].clientY - startY;
                // Only treat as a horizontal swipe if horizontal movement dominates
                if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 40) {
                    if (dx < 0 && currentPage === 0) {
                        goToPage(1); // swipe left → next page
                    } else if (dx > 0 && currentPage === 1) {
                        goToPage(0); // swipe right → prev page
                    }
                }
            }, { passive: true });
        })();
    </script>


    <div id="footer">
        <script src="Scripts/footer3.js?v3"></script>
