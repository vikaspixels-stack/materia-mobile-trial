        document.getElementById('loginForm').addEventListener('submit', function (event) {
            event.preventDefault();
            var formData = new FormData(this);

            localStorage.removeItem('AccessToMobileDevice_GUID');
            localStorage.removeItem('UserID');
            localStorage.removeItem('MobileDevice_ContactModulePermissions');
            localStorage.removeItem('MobileDevice_CompanyModulePermissions');
            localStorage.removeItem('MobileDevice_IsCompanyEditAllowed');
            localStorage.removeItem('EmailGridDefaultView');
            var xhr = new XMLHttpRequest();
            xhr.open('POST', '/api/authMob/login');
            xhr.setRequestHeader('Content-Type', 'application/json');

                xhr.onreadystatechange = function () {
                    if (xhr.readyState === XMLHttpRequest.DONE) {
                        if (xhr.status === 200) {
                            var response = JSON.parse(xhr.responseText);
                            var token = response.Token;
                            var data = response.User;
                           // alert(data.MobileDevice_CompanyModulePermissions);
                            // Store user data in localStorage
                            localStorage.setItem('LoginName', data.LoginName);
                            localStorage.setItem('UserID', data.UserID);
                            localStorage.setItem('IsSuperUser', data.IsSuperUser);
                            localStorage.setItem('AccessToMobileDevice_GUID', data.AccessToMobileDevice_GUID);
                            localStorage.setItem('IsContactEditAllowedonMobile', data.IsContactEditAllowedonMobile);
                            localStorage.setItem('MobileDevice_ContactModulePermissions', data.MobileDevice_ContactModulePermissions);
                            localStorage.setItem('MobileDevice_IsContactDeleteAllowed', data.MobileDevice_IsContactDeleteAllowed);
                            localStorage.setItem('MobileDevice_IsCompanyEditAllowed', data.MobileDevice_IsCompanyEditAllowed);
                            localStorage.setItem('MobileDevice_CompanyModulePermissions', data.MobileDevice_CompanyModulePermissions);
                            localStorage.setItem('MobileDevice_IsCompanyDeleteAllowed', data.MobileDevice_IsCompanyDeleteAllowed);
                            localStorage.setItem('EmailGridDefaultView', data.EmailGridDefaultView);
                            //alert(data.EmailGridDefaultView);
                            // Redirect to dashboard.html or any other page
                            console.log(data.IsSuperUser);
                            window.location.href = 'dashboard.html';
                        } else {
                            alert('Login failed. Please check your credentials.');
                        }


                    }
            };

            xhr.onerror = function () {
                console.error('Request failed');
            };

            var jsonBody = JSON.stringify({
                Username: formData.get('username'),
                Password: formData.get('password')
            });
            //alert(jsonBody);
