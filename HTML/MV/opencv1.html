<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera Capture & Metadata Extraction</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        .container {
            text-align: center;
            margin-top: 30px;
        }

        .image-container img {
            width: 100%;
            max-width: 400px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="camera-container">
            <button id="openCameraButton" class="btn btn-primary">📷 Open Camera</button>
        </div>
        <div class="image-container">
            <img id="preview" src="" alt="Captured Image">
        </div>
        <h3 class="mt-4">Verification Result:</h3>
        <div id="metadataOutput" class="border p-3 bg-light"></div>
    </div>

    <script>
        document.getElementById("openCameraButton").addEventListener("click", function () {
            const fileInput = document.createElement("input");
            fileInput.type = "file";
            fileInput.accept = "image/*";
            fileInput.capture = "environment"; // Uses back camera

            fileInput.addEventListener("change", function (event) {
                const file = event.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function (e) {
                        document.getElementById("preview").src = e.target.result;
                        uploadImage(file);
                    };
                    reader.readAsDataURL(file);
                }
            });

            fileInput.click();
        });

        async function uploadImage(file) {
            let formData = new FormData();
            formData.append("file", file);

            try {
                document.getElementById("metadataOutput").innerText = "Processing...";

                const response = await fetch("/api/OpenCV/verify", {
                    method: "POST",
                    body: formData
                });

                const data = await response.json();
                document.getElementById("metadataOutput").innerText = data.Message;
            } catch (error) {
                console.error("Error:", error);
                document.getElementById("metadataOutput").innerText = "Error processing image.";
            }
        }
    </script>
</body>
</html>
