<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAP-GRN-POST Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <style>
        body {
            padding: 40px;
            background: #f5f5f5;
        }

        #log {
            background: #1e1e1e;
            color: #d4d4d4;
            font-family: monospace;
            font-size: 13px;
            padding: 16px;
            border-radius: 6px;
            min-height: 200px;
            max-height: 400px;
            overflow-y: auto;
            white-space: pre-wrap;
            margin-top: 20px;
        }

        .log-ok {
            color: #4ec9b0;
        }

        .log-error {
            color: #f48771;
        }

        .log-info {
            color: #9cdcfe;
        }
    </style>
</head>
<body>
    <div class="container" style="max-width:600px;">
        <h5 class="mb-1">SAP-GRN-POST — Flow Trigger Test</h5>
        <p class="text-muted small mb-3">Hits <code>POST /api/TestGrnPost/Trigger</code> with the hardcoded payload.</p>

        <button id="btnTrigger" class="btn btn-primary px-4">
            Trigger SAP-GRN-POST
        </button>

        <div id="log">Waiting for trigger…</div>
    </div>

    <script>function log(msg, cls) {
            var el  = document.getElementById('log');
            var ts  = new Date().toLocaleTimeString();
            var div = document.createElement('div');
            if (cls) div.className = cls;
            div.textContent = '[' + ts + '] ' + msg;
            el.appendChild(div);
            el.scrollTop = el.scrollHeight;
        }

        $('#btnTrigger').on('click', function () {
            var $btn = $(this);
            $btn.prop('disabled', true).text('Triggering…');
            log('Sending POST to /api/TestGrnPost/Trigger…', 'log-info');

            $.ajax({
                url:         '/api/TestGrnPost/Trigger',
                type:        'POST',
                contentType: 'application/json',
                timeout:     60000, // 60s client-side timeout
                data: JSON.stringify({
                    requestHeader: {
                        flowId:       'SAP-GRN-POST',
                        requestId:    '43545261250040000',
                        partnerSysId: 'VCPL',
                        timestamp:    '2026-03-16T09:23:47Z'
                    },
                    parameters: {
                        deliveryNumber:  '8133204490',
                        saleQuantity:    1.0,
                        depotCode:       'A618',
                        truckNumber:     'KL06A1234',
                        tokenRRNumber:   '0',
                        storageLocation: 'LT01'
                    }
                }),
                success: function (response) {
                    log('SUCCESS — HTTP 200/201', 'log-ok');
                    log(JSON.stringify(response, null, 2), 'log-ok');
                },
                error: function (xhr, status, error) {
                    log('ERROR — status: ' + status + ', HTTP: ' + xhr.status, 'log-error');
                    log('Response: ' + xhr.responseText, 'log-error');
                },
                complete: function () {
                    $btn.prop('disabled', false).text('Trigger SAP-GRN-POST');
                    log('Request complete.', 'log-info');
                }
            });
        });</script>
</body>
</html>
