    <script>
        $(document).ready(function () {

                    $.each($("#lstSaleInvoiceDetail.k-listview").find("div.k-listview-content").find("div.k-listview-item"), function (k, i) {
                        //console.log(i);
                        $(i).kendoExpansionPanel({
                            title: 'ssss',
                            subTitle: '',
                            complete: function (e) {
                                //console.log();
                                let dataItem = $("#lstSaleInvoiceDetail").data("kendoListView").dataItem($(e.sender.element));
                                var template = kendo.template($("#tmpSaleInvoiceDetailExpand").html());
                                var data = dataItem;
                                //console.log(template(data));
                                e.sender.element.closest("div.k-expander-content-wrapper").closest("div.k-expander").find("div.k-expander-header").find("div.k-expander-title").html(template(data));

                                e.sender.element.closest("div.k-expander-content-wrapper").closest("div.k-expander").find("div.k-expander-header").css('border-bottom-color', '#E0E0E0');

                                e.sender.element.closest("div.k-expander-content-wrapper").closest("div.k-expander").find("div.k-expander-header").css('padding-bottom', '10px');

                                        .closest(".k-expander")

                                        .prop("disabled", true)

                                            "cursor": "not-allowed",
                                            "opacity": "0.6"
                                        })
                                        .removeAttr("onclick");
                                }


                            }
                        });
                    });
                    //$("#lstSaleInvoiceDetail").data("kendoListView")
                    //var data = this.dataSource.view();
                    //for (var i = 0; i < data.length; i++) {
                    //    var dataItem = data[i];
                    //    console.log(dataItem);
                    //}
                }
            });

            setListViewHeight();
            $(window).resize(setListViewHeight);
        });

        const currentUrl = window.location.href;

    <!-- ══ Damage / Shortage type selector — bottom sheet ══════════════ -->
    <!-- ══ Damage / Shortage type selector — compact popup ════════════ -->
    <!-- Lightweight dismiss overlay (no dark tint) -->
    <div id="dmgOverlay" onclick="closeDamageSheet()" style="
         display:none;position:fixed;inset:0;
         background:transparent;z-index:1000;"></div>

    <div id="dmgSheet" style="
         display:none;position:fixed;
         background:#fff;border-radius:8px;
         padding:10px 10px 8px;z-index:1001;
         box-shadow:0 4px 18px rgba(0,0,0,0.22);
         width:170px;">
        <button onclick="openArrivalDamage('Damage')" style="
                width:100%;padding:9px 6px;margin-bottom:6px;
                background:#1565C0;color:#fff;font-size:13px;font-weight:700;
                border:none;border-radius:5px;cursor:pointer;display:block;">
            &#9888; Damage (TL01)
        </button>
        <button onclick="openArrivalDamage('Shortage')" style="
                width:100%;padding:9px 6px;margin-bottom:6px;
                background:#f0a500;color:#fff;font-size:13px;font-weight:700;
                border:none;border-radius:5px;cursor:pointer;display:block;">
            &#9866; Shortage (List)
        </button>
        <button onclick="closeDamageSheet()" style="
                width:100%;padding:7px 6px;background:#e0e0e0;
                color:#555;font-size:12px;font-weight:600;
                border:none;border-radius:5px;cursor:pointer;display:block;">
            Cancel
        </button>
    </div>

    <script>
        var _ds = {};   /* damage sheet data store */

        function showDamageSheet(grnid, mtrid, da, truck, balBags, balMT, driverName, driverMobile, productid) {
            _ds = { grnid:grnid, mtrid:mtrid, da:da, truck:truck,
                    balBags:balBags, balMT:balMT,
                    driverName:driverName, driverMobile:driverMobile,
                    productid:productid };

            var sheet = document.getElementById('dmgSheet');
            var overlay = document.getElementById('dmgOverlay');

            /* Show offscreen first to measure height */
            sheet.style.visibility = 'hidden';
            sheet.style.display = 'block';
            var sheetH = sheet.offsetHeight;
            var sheetW = sheet.offsetWidth;
            sheet.style.visibility = '';

            /* Find the clicked Damage button */
            var btn = event.currentTarget || event.target;
            var rect = btn.getBoundingClientRect();

            var vpW = window.innerWidth;
            var vpH = window.innerHeight;
            var gap = 4;   /* px gap between button and popup */

            /* Horizontal: align left edge with button; clamp to viewport */
            var left = Math.min(rect.left, vpW - sheetW - 6);
            left = Math.max(left, 6);

            /* Vertical: prefer below button; flip above if not enough room */
            var top;
            if (rect.bottom + gap + sheetH <= vpH) {
                top = rect.bottom + gap;          /* below */
            } else {
                top = Math.max(rect.top - gap - sheetH, 6);  /* above */
            }

            sheet.style.left = left + 'px';
            sheet.style.top = top + 'px';

            overlay.style.display = 'block';
        }

        function closeDamageSheet() {
            document.getElementById('dmgSheet').style.display = 'none';
            document.getElementById('dmgOverlay').style.display = 'none';
        }

       function openArrivalDamage(type) {
            closeDamageSheet();
            window.location.href = 'ArrivalDamage.html'
                + '?GRNID='        + _ds.grnid
                + '&MTRID='        + _ds.mtrid
                + '&DA='           + _ds.da
                + '&PlantTruck='   + _ds.truck
                + '&BalBags='      + _ds.balBags
                + '&BalMT='        + _ds.balMT
                + '&DriverName='   + _ds.driverName
                + '&DriverMobile=' + _ds.driverMobile
                + '&ProductID='    + _ds.productid
                + '&Type='         + type;
        }

    </script>
