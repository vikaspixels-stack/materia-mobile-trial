<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera Capture & Metadata Extraction</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        .container {
            text-align: center;
            margin-top: 30px;
        }

        .image-container img {
            width: 100%;
            max-width: 400px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="camera-container">
            <button id="openCameraButton" class="btn btn-primary">📷 Open Camera</button>
        </div>
        <div class="image-container">
            <img id="preview" src="" alt="Captured Image">
        </div>
        <h3 class="mt-4">Metadata & Analysis Result:</h3>
        <div id="metadataOutput" class="border p-3 bg-light"></div>
    </div>

    <script>
        document.getElementById("openCameraButton").addEventListener("click", function () {
            const fileInput = document.createElement("input");
            fileInput.type = "file";
            fileInput.accept = "image/*";
            fileInput.capture = "environment"; // Uses back camera

            fileInput.addEventListener("change", function (event) {
                const file = event.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function (e) {
                        const base64DataUrl = e.target.result;
                        document.getElementById("preview").src = base64DataUrl;
                        uploadImage(base64DataUrl);
                    };
                    reader.readAsDataURL(file);
                }
            });

            fileInput.click();
        });

        async function uploadImage(imageData = null) {
            if (!imageData) {
                alert("Please capture an image first.");
                return;
            }

            // Extract Base64 string (removing 'data:image/jpeg;base64,')
            const base64String = imageData.split(',')[1];

            const requestData = {
                image: base64String
            };

            try {
                document.getElementById("metadataOutput").innerText = "Processing...";

                const response = await fetch("/api/ImageProcessing/upload", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(requestData)
                });

                const data = await response.json();
                displayMetadata(data);
            } catch (error) {
                console.error("Error:", error);
                document.getElementById("metadataOutput").innerText = "Error processing image.";
            }
        }
//        <h4>General Information:</h4>
//<strong>Is Real-Time Capture?</strong> ${ data.IsRealTime ? "✅ Yes" : "❌ No" } <br>
//            <strong>Is Edited?</strong> ${data.IsEdited ? "❌ Yes (Edited)" : "✅ No (Original)"}<br>
//                <strong>Is Deepfake?</strong> ${data.IsDeepfake ? "❌ Yes (AI-Generated)" : "✅ No (Authentic)"}<br>
//                    <hr>
        function displayMetadata(data) {
            let metadataHtml = `
                        <h4>Complete Metadata:</h4>
                        <pre>${JSON.stringify(data.Metadata, null, 4)}
                        ${JSON.stringify(data.ImageService, null, 4)}</pre>
                    `;
            document.getElementById("metadataOutput").innerHTML = metadataHtml;
        }
    </script>
</body>
</html>
