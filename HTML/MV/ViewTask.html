<!DOCTYPE html>
<html>
<head>
    <title>Materia Mobile</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <!-- Bootstrap CSS from CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap JS from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Font Awesome CSS from CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <!-- jQuery (keep one; 3.7.0 matches your Kendo include below) -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>

    <link href="css/materia.css?v=1.23" rel="stylesheet" />
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#7952b3">

    <!-- Kendo CSS/Fonts -->
    <link href="https://v24.vaidworld.com/Kendo/default-main.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://unpkg.com/@progress/kendo-font-icons/dist/index.css" />

    <!-- Kendo JS + License -->
    <script src="https://v24.vaidworld.com/Kendo/kendo.all.min.js"></script>
    <script src="https://v24.vaidworld.com/Kendo/telerik-license.js"></script>

    <style>
        body.bg-off-white {
            background: #f8fafc;
        }

        .card-like {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 6px 20px rgba(0,0,0,.06);
            padding: 16px;
        }

        .form-label {
            font-weight: 600;
        }

        .value {
            white-space: pre-wrap;
        }

        .muted {
            color: #64748b;
        }

        .button-row {
            display: flex;
            gap: .5rem;
        }

        a.attachment-link {
            word-break: break-all;
        }
        /* Justify only the description */
        #taskNotes {
            text-align: justify;
            text-justify: inter-word; /* nice-to-have */
            hyphens: auto; /* optional: better wrapping */
        }
    </style>
</head>
<body class="bg-off-white">
    <!-- Kendo toast host (same as entry page pattern) -->
    <div id="taskToast"></div>

    <div class="container-fluid">
        <!-- HEADER (same includes) -->
        <header id="header">
            <script src="Scripts/header.js?v=1.06" defer></script>
        </header>

        <main>
            <div class="card-like">
                <div class="row g-3">
                    <div class="col-12">
                        <label class="form-label">Task Title</label>
                        <div id="taskTitle" class="value"></div>
                    </div>

                    <div class="col-12">
                        <label class="form-label">Task Notes</label>
                        <div id="taskNotes" class="value"></div>
                    </div>

                    <div class="col-12" id="attachmentRow" style="display:none;">
                        <label class="form-label">Attachment</label>
                        <div>
                            <i class="fa fa-paperclip muted" aria-hidden="true"></i>
                            <a id="attachmentLink" class="attachment-link" href="#" target="_blank" rel="noopener">Open file</a>
                        </div>
                    </div>

                    <div class="col-12">
                        <div id="error" class="text-danger" style="display:none;"></div>
                    </div>

                    <div class="col-12">
                        <div class="button-row">
                            <button type="button" class="btn btn-secondary" onclick="window.history.back();">BACK</button>
                        </div>
                    </div>
                </div>
            </div>

            <div style="height:30px;"></div>
        </main>
    </div>

    <!-- FOOTER (same includes) -->
    <footer id="footer">
        <script src="Scripts/footer3.js?v1.25" defer></script>
        <!-- no depotselection needed on view page, but keep footer structure consistent -->
    </footer>

    <script>
        // Make taskToast visible to other handlers (same pattern as entry)
        var taskToast;

        $(document).ready(function () {
            // Optional: set page title in header
            if (typeof fnSetPageName === "function") {
                fnSetPageName("User Defined Task");
            }

            // Kendo Notification
            taskToast = $("#taskToast").kendoNotification({
                stacking: "down",
                autoHideAfter: 3000,
                position: { pinned: true, top: 20, right: 20 },
                templates: [
                    { type: "success", template: "<div class='k-notification-wrap'><span class='k-icon k-i-check'></span> #= message #</div>" },
                    { type: "error", template: "<div class='k-notification-wrap'><span class='k-icon k-i-warning'></span> #= message #</div>" }
                ]
            }).data("kendoNotification");

            const id = getQueryId();
            if (!id) {
                showError("Missing or invalid task id.");
                return;
            }

            // Fetch details from your controller (PascalCase properties)
            $.getJSON("/api/UserDefinedTask/TaskDetails", { taskId: id })
                .done(function (data) {
                    // Be robust to both PascalCase and camelCase
                    const title = data.TaskTitle ?? data.taskTitle ?? "";
                    const notes = data.TaskNotes ?? data.taskNotes ?? "";
                    let path = data.AttachmentFilePath ?? data.attachmentFilePath ?? "";

                    $("#taskTitle").text(title);
                    $("#taskNotes").text(notes);

                    // Normalize attachment path:
                    // 1) Strip leading ~/wwwroot or wwwroot if present
                    // 2) If only a bare filename is returned, prefix uploads folder
                    // 3) Ensure leading slash so it serves from web root
                    if (path) {
                        path = String(path).replace(/^~?\/?wwwroot\/?/i, "");
                        const uploadsPrefix = "Uploads/Mobile/UserDefinedTask/";

                        // If it's just a filename (no slash), prefix the uploads path
                        if (!path.includes("/")) {
                            path = uploadsPrefix + path;
                        } else if (!/^uploads\/mobile\/userdefinedtask\//i.test(path)) {
                            // If it doesn't already start with the uploads folder but has a subpath,
                            // leave it as-is (you may already be storing 'Uploads/.../file.ext')
                        }

                        const href = path.startsWith("/") ? path : "/" + path.replace(/^\/+/, "");
                        $("#attachmentLink").attr("href", href);
                        $("#attachmentRow").show();
                    } else {
                        $("#attachmentRow").hide();
                    }
                })
                .fail(function (xhr) {
                    const msg = (xhr.responseJSON && (xhr.responseJSON.title || xhr.responseJSON.message)) ||
                        xhr.responseText || xhr.statusText || "Failed to load task.";
                    showError(msg);
                });
        });

        function getQueryId() {
            const p = new URLSearchParams(window.location.search);
            return parseInt(p.get("id") || "0", 10);
        }

        function showError(msg) {
            $("#error").text(msg).show();
            if (taskToast) taskToast.show({ message: msg }, "error");
        }
    </script>
</body>
</html>
