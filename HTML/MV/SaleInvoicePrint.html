    <script>
        $(document).ready(function () {
            fnSetPageName("Sale Invoice Print");

            $.ajax({
                url: '../api/SaleInvoicePrint?LSID='+getParameter("LSID"),
                type: 'GET',
                dataType: 'json',
                async: false,
                success: function (dataSource) {
                   // alert(dataSource.IsPrinted);
                    $("#dvInvoiceNo").html(dataSource.InvoiceNo);
                    var count = dataSource.IsPrinted;
                    var displayText = "";

                    if (count === 0) {
                        displayText = "No";
                    } else {
                        displayText = count + (count === 1 ? " time" : " times");
                    }

                    $("#dvPrinted").html(displayText);
                    $("#dvInvoiceDate").html(dataSource.InvoiceDate);
                    $("#dvDealer").html(dataSource.SoldToParty);
                    $("#dvProduct").html(dataSource.ProductID);
                    $("#dvQuantity").html(dataSource.TotalQty);
                    document.getElementById("dvDriverPhoto").src = "/Uploads/Mobile/SaleInvoicePrint/DriverPhoto/"+dataSource.DriverPhoto;
                    document.getElementById("dvSignedInvoicePhoto").src = "/Uploads/Mobile/SaleInvoicePrint/SignedInvoicePhoto/" + dataSource.SignedInvoicePhoto;

                    if (dataSource.InvoiceFileName !== "") {
                        $("#btnPrintSaleinvoice").removeAttr("disabled");
                        //$("#btnPrintSaleinvoice").attr("onclick", "viewFile('" + dataSource.LSID + "." + dataSource.InvoiceFileName + "'," + dataSource.LSID + ")");
                        $("#btnPrintSaleinvoice").attr("onclick", "viewFile('"+dataSource.InvoiceFileName + "'," + dataSource.LSID + ")");
                    }

                }
            });

            
        });

        function viewFile(FileName, LSID) {
            updateIsPrinted(LSID);

            const url = `https://materiatractus.com/Uploads/MobileLoadingUnloadingSlip/Invoice/${FileName}`;

            const iframe = document.createElement("iframe");
            iframe.style.position = "absolute";
            iframe.style.left = "-9999px";
            iframe.src = url;
            document.body.appendChild(iframe);

            iframe.onload = () => {
                setTimeout(() => {
                    try {
                        iframe.contentWindow.focus();
                        iframe.contentWindow.print();
                    } catch {
                        window.open(url, "_blank");
                    }
                }, 500);
            };
        }




        function getParameter(name) {
            var results = new RegExp('[\?&]' + name + '=([^&#]*)').exec(window.location.href);
            return (results != null ? results[1] || 0 : '');
        }

        function PhotoClick(appenddiv) {
            const fileInput = document.createElement("input");
            fileInput.type = "file";
            fileInput.accept = "image/*";
            fileInput.capture = "environment";

            fileInput.addEventListener("change", function (event) {
                const file = event.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function (e) {
                        const base64String = e.target.result;
                        document.getElementById(appenddiv).src = base64String;
                        const lsid = getParameter("LSID");
                        const extension = file.name.split('.').pop();
                        const customFileName = `${lsid}.${extension}`;
                        if (appenddiv == "dvDriverPhoto") {
                            uploadBase64ToServerDriverPhoto(base64String, customFileName, lsid);
                        }
                        else {
                            uploadBase64ToServerInvoicePhoto(base64String, customFileName, lsid);
                        }
                    };
                    reader.readAsDataURL(file);
                }
            });

            fileInput.click();
        }

        function uploadBase64ToServerDriverPhoto(base64String, fileName,lsid) {
            $.ajax({
                url: '/api/SaleInvoicePrint/SaveDriverPhoto',
                method: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({
                    base64: base64String,
                    fileName: fileName,
                    lsid: lsid
                }),
                success: function (response) {
                    console.log("Saved successfully:", response);
                },
                error: function (error) {
                    console.error("Error saving:", error);
                }
            });
        }
        function uploadBase64ToServerInvoicePhoto(base64String, fileName, lsid) {
            $.ajax({
                url: '/api/SaleInvoicePrint/SaveSignedInvoicePhoto',
                method: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({
                    base64: base64String,
                    fileName: fileName,
                    lsid: lsid
                }),
                success: function (response) {
                    console.log("Saved successfully:", response);
                },
                error: function (error) {
                    console.error("Error saving:", error);
                }
            });
        }
        function updateIsPrinted(lsid) {
            $.ajax({
                url: '/api/SaleInvoicePrint/UpdateIsPrinted',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify(lsid),
                success: function (response) {
                    console.log("IsPrinted updated successfully for LSID:", lsid);
                    console.log(response);
                },
                error: function (xhr, status, error) {
                    console.error("Error updating IsPrinted:", error);
                    alert("Failed to update print status. Please try again.");
                }
            });
        }
