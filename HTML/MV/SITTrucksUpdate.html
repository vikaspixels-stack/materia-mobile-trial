        function extractMetadata(file) {
            const reader = new FileReader();
            reader.readAsArrayBuffer(file);
            reader.onload = function (event) {
                const exifData = EXIF.readFromBinaryFile(event.target.result);

                const latitude = exifData?.GPSLatitude ? convertToDecimal(exifData.GPSLatitude, exifData.GPSLatitudeRef).toFixed(2) : "N/A";
                const longitude = exifData?.GPSLongitude ? convertToDecimal(exifData.GPSLongitude, exifData.GPSLongitudeRef).toFixed(2) : "N/A";
                const dateTime = exifData?.DateTimeOriginal ? formatDateTime(exifData.DateTimeOriginal) : "N/A";
                //  const isRealImage = (latitude !== "N/A" && longitude !== "N/A") ? "✅ Real Image" : "❌ Fake Image (No GPS Data)";
                /*<br>📍 <b>Location:</b> ${latitude}, ${longitude}*/
                /*  `📅 <b>Date/Time:</b> ${dateTime}<br>*/
                document.getElementById("metadata").innerHTML =
                    `📅 <b>Date/Time:</b><br> <span id="image_datetime"></span>    <br>
                                    <div style="display:none"> <b>🌍 Dist. from Depot:</b> <span id="distance_from_depot"></span>
                                    <br>📝 <b>Image Authenticity:</b> <span id="image_authenticity"></span></div>`;

                if (latitude !== "N/A" && longitude !== "N/A") {
                    calculateDistance(latitude, longitude);
                }

            };
        }

        function convertToDecimal(coord, ref) {
            const decimal = coord[0] + (coord[1] / 60) + (coord[2] / 3600);
            return (ref === "S" || ref === "W") ? -decimal : decimal;
        }

        function calculateDistance(lat1, lon1) {
            const R = 6371000;
            const lat1Rad = lat1 * Math.PI / 180;
            const lon1Rad = lon1 * Math.PI / 180;
            const lat2Rad = BASE_LAT * Math.PI / 180;
            const lon2Rad = BASE_LON * Math.PI / 180;

            const dLat = lat2Rad - lat1Rad;
            const dLon = lon2Rad - lon1Rad;

            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1Rad) * Math.cos(lat2Rad) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);

            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            const distance = (R * c);
            const distanceKM = (R * c) / 1000;

            document.getElementById("distance_from_depot").innerText = `${distanceKM.toFixed(2)} km.`;
            //  alert(distanceKM);
           // if (distanceKM > 200) 
            if (distance > 100) {
                $("#dvWarning").show();
                playWarning();
                $("#dvAwayMessage").html("<b> You are currently away from the depot.</b>");
                speakText("You are away from the depot");
                $("#dvAwayMessage").show();
                $("#btnSubmit").addClass("disabled").removeClass("submit").attr("disabled", true);
            }
        }



        function compressAndUpload(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);

                reader.onload = function (event) {
                    const img = new Image();
                    img.src = event.target.result;

                    img.onload = function () {
                        const canvas = document.createElement("canvas");
                        const ctx = canvas.getContext("2d");
                        canvas.width = 700;
                        canvas.height = 700;
                        ctx.drawImage(img, 0, 0, 700, 700);

                        canvas.toBlob(async function (blob) {
                            document.getElementById("preview").src = URL.createObjectURL(blob);
                            const formData = new FormData();
                            formData.append("image", blob, "compressed_image.jpg");

                            try {
                                document.getElementById("registration_number").innerText = "Processing...";
                                document.getElementById("dvProcessing").innerText = "Registration Number Processing...";

                                const response = await fetch("/api/VehicleNumberExtractor/license-plate", {
                                    method: "POST",
                                    body: formData
                                });

                                const data = await response.json();
                                document.getElementById("dvProcessing").innerText = "";
                                document.getElementById("registration_number").innerText = " " + data.registration_number;
                                // $("#txtTruckNumber").val(data.registration_number);
                                var cleanTruckNo = sanitizeTruckNumber(data.registration_number);
                                $("#txtTruckNumber").val(cleanTruckNo);
                                const regNo = data.registration_number.toLowerCase();
                                const failureIndicators = [
                                    "unable to",
                                    "can't extract",
                                    "not readable",
                                    "no visible",
                                    "too blurry",
                                    "obstructed",
                                    "could not find",
                                    "sorry",
                                    "no number plate"
                                ];

                                const isExtractionFailed = failureIndicators.some(keyword => regNo.includes(keyword));

                                if (isExtractionFailed) {
                                    $("#dvWarning").show();
                                    $("#dvTruckNumberMessage").html("<b>" + data.registration_number + "</b>");
                                    $("#txtTruckNumber").val('');
                                }

                            } catch (error) {
                                console.error("Error:", error);
                                document.getElementById("registration_number").innerText = "Error extracting registration number.";
                                return false;
                            } finally {
                                resolve(); // <- this tells the await to continue
                            }
                        }, "image/jpeg", 1.0);
                    };

                    img.onerror = () => reject(new Error("Image failed to load"));
                };

                reader.onerror = () => reject(new Error("File could not be read"));
            });
        }



        async function vehicleImageAnalyse(file) {
            var formData = new FormData();
            formData.append('image', file);

            $.ajax({
                url: '/api/VehicleImageAnalyse/upload',
                type: 'POST',
                data: formData,
                processData: false,
                contentType: false,
                success: function (response) {
                    console.log('API Response:', response);
                    $("#image_authenticity").html(response.analysis_result);
                    var message = response.analysis_result;
                    let probabilityMatch = message.match(/(\d+(?:\.\d+)?)%/);
                    let probability = probabilityMatch ? parseFloat(probabilityMatch[1]) : null;
                    if (

                        message.includes("The photo was captured from a screen") ||
                        message.includes("The photo was likely captured from a screen") ||
                        (probability !== null && probability <= 90)
                    ) {
                        //playWarning();
                        $("#dvWarning").show();
                        speakText("This is not a real time image");
                        $("#dvImageMessage").html("<b>This is not a real-time image.</b>");
                        $("#dvImageMessage").show();
                        $("#dvAwayMessage").show();
                        $("#btnSubmit").addClass("disabled").removeClass("submit").attr("disabled", true);
                    }

                    //alert('Analysis Result: ' + response.analysis_result);
                },
                error: function (xhr, status, error) {
                    console.error('Error:', xhr.responseText);
                    alert('Error uploading image: ' + xhr.responseText);
                }
            });
        }

                    alert('Error uploading image: ' + xhr.responseText);
                }
            });
        }


        function formatDateTime(dateTime) {
            const [date, time] = dateTime.split(' ');
            const [year, month, day] = date.split(':');
            const [hours, minutes] = time.split(':');

            return `${day}/${month}/${year} ${hours}:${minutes}`;
        }

        function CreateRecordAfterImageCapture() {

            var vTruckNumber = $("#txtTruckNumber").val().replace(/\s+/g, '');

            const vDestinationDepotID = queryParams.get("DestinationDepotID");
            const vGRNID = $("#hdnGRNID").val();

                TruckPhotoFileName: vTruckPhotoFileName,
                TruckNumber: vTruckNumber,
                DANumber: vDANumber,
                SourceDepotID:vSourceDepotID,
                DestinationDepotID: vDestinationDepotID,
                GRNID: vGRNID,
                GRNIDList: vGRNIDList,
            }
            //   alert(verifyOrderParam);
            $.ajax({
                url: "/api/PlantTruck/CreateRecordAfterImageCapture",
                type: "POST",
                contentType: "application/json",
                data: JSON.stringify(verifyOrderParam),
                success: function (response) {
                   // alert(response.ShipmentNumber);
                    console.log("API Response:", response);

                    if (response?.PlantTruckID) {
                        $("#hdnPlantTruckID").val(response.PlantTruckID);
                        $("#dvbtnTruckNoOverride").show();
                        $("#btnTruckNoOverride").show();
                        $("#btnTruckNoOverrideRefresh").hide();
                        const detectedNumber = $("#txtTruckNumber").val()?.replace(/\s+/g, '').toUpperCase();
                        const expectedNumber = localStorage.getItem("ExpectedTruckNumber")?.replace(/\s+/g, '').toUpperCase();
                        //if (expectedNumber && detectedNumber && detectedNumber !== expectedNumber) {
                        //    alert(`Truck Number does not match.`);
                        //    $("#btnSubmit").removeClass("submit").addClass("disabled").attr("disabled", true);

                        //    // return;
                        //}
                        //else {
                        //    $("#btnSubmit").removeClass("disabled").addClass("submit").removeAttr("disabled");
                        //}

                        if (!detectedNumber) {
                            // No truck number detected
                            $("#btnSubmit").removeClass("submit").addClass("disabled").attr("disabled", true);
                         //   alert("No truck number detected.");
                        }
                        else if (expectedNumber && detectedNumber !== expectedNumber) {

        function fnSubmit() {

            // ------------------ BASIC VALUES ------------------
            var grnId = $("#hdnGRNIDList").val();
            var truckNumber = $("#txtTruckNumber").val()?.trim();
            var notes = $("#txtMTNotes").val();
            var plantTruckID = $("#hdnPlantTruckID").val();

            // ------------------ VALIDATION ------------------
            if (!grnId) {
                alert("GRN ID is missing.");
                return;
            }

            if (!plantTruckID || isNaN(plantTruckID)) {
                alert("Plant Truck ID is missing.");
                return;
            }

            if (!notes) {
                alert("Notes is mandatory.");
                return;
            }


            // ------------------ SAVE MISSING TRUCK ------------------
            var dataToSend = {
                GRNID: grnId,
                MTRID: 1,
                MTNotes: notes || null,
                ArrTime: new Date().toISOString(),
                ActionTime: new Date().toISOString(),
                PlantTruckID: parseInt(plantTruckID)
            };

            $.ajax({
                url: "/api/PlantTruck/SaveMissingTruckComment",
                type: "POST",
                contentType: "application/json",
                data: JSON.stringify(dataToSend),

                success: function () {

                    // ------------------ RPA VALIDATION ------------------
                    var shipmentNumber = $("#hdnShipmentNumber").val();
                    var depotCode = localStorage.getItem("SAPDepotID");

                    if (!shipmentNumber) {
                        alert("Shipment Number is missing. SAP flow not triggered.");
                        return;
                    }

                    if (!depotCode) {
                        alert("Depot Code is missing. Please re-login.");
                        return;
                    }
                    //alert(
                    //    "Shipment Number: " + shipmentNumber + "\n" +
                    //    "Depot Code: " + depotCode + "\n" +
                    //    "Truck Number: " + truckNumber
                    //);
                    // ------------------ TRIGGER SAP FLOW ------------------
                    $.ajax({
                        url: "/api/FlowGrnTruckInTime/Trigger",
                        type: "POST",
                        contentType: "application/json",
                        data: JSON.stringify({
                            requestHeader: {
                                FlowId: "SAP-GRN-TRUCK-INTIME"
                            },
                            parameters: {
                                shipmentNumber: shipmentNumber,
                                depotCode: depotCode,
                                truckNumber: truckNumber,
                                isGenerateTransMetadata: true
                            }
                        }),

                        success: function () {
                            alert("Submitted successfully!");
                            window.location.href = "SITTrucks.html";
                        },

                        error: function (xhr) {
                            console.error("RPA error:", xhr.responseText);
                            alert("Saved, but SAP flow failed. Please inform IT.");
                            window.location.href = "SITTrucks.html";
                        }
                    });
                },

                error: function (xhr) {
                    console.error("Save error:", xhr.responseText);
                    alert("Failed to save truck status.");
                }
            });
        }


        function sanitizeTruckNumber(val) {
            return val.replace(/[^a-zA-Z0-9]/g, '').toUpperCase();
        }
